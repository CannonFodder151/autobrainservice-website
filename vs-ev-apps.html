    <div class="card u-mt-28">
      <h2>The fundamental difference</h2>
      <p><strong>Tesla App, ChargePoint, PlugShare, ABRP, EV Hotels</strong> are <em>EV charging & navigation tools</em>. They're excellent at their specific jobs: Tesla for Tesla vehicle controls, ChargePoint/PlugShare for finding chargers, ABRP for route planning, EV Hotels for destination charging. But they're single-purpose and EV-only.</p>
      <p><strong>AutoBrain</strong> is a <em>unified car ownership platform</em>. It does EV charging tracking AND:</p>
      <ul>
        <li><strong>PHEV dual-source tracking</strong> — petrol + electric on one dashboard (Q4 2026)</li>
        <li><strong>ICE fuel tracking</strong> — L/100km, $/km, Servo Spy price watch for your petrol cars</li>
        <li><strong>Predictive maintenance</strong> — AI + deterministic fallback catches issues before codes set</li>
        <li><strong>Australian rego lookup</strong> — free on-demand + paid daily Rego Status</li>
        <li><strong>Complete service history</strong> — receipts, parts, labour, reminders for ALL vehicles</li>
        <li><strong>ATO logbook</strong> — GPS trips for tax, automatic with OBD2 adapter</li>
        <li><strong>Self-hosted option</strong> — MIT license, your VPS, your data, no subscription ever</li>
      </ul>
      <p>If you only drive a Tesla and only need Tesla features, the Tesla app is perfect. If you have multiple vehicles (EV + PHEV + ICE), or you want charging analytics unified with maintenance, fuel costs, rego, and predictive health — AutoBrain is built for that.</p>
    </div>

    <div class="card u-mt-28">
      <h2>The PHEV advantage: one dashboard for dual-source</h2>
      <p>This is the feature no EV-only app can offer. Plug-in hybrids (Outlander PHEV, MG HS+EV, BYD Seal U DM-i, Ford Escape PHEV, Volvo Recharge, BMW 330e/X5e, Mercedes 300e) use both petrol and electric. EV apps ignore the petrol side entirely.</p>
      <p>AutoBrain's PHEV support (Q4 2026) gives you:</p>
      <ul>
        <li><strong>Petrol side:</strong> Every fill-up — litres, cost, L/100km, $/km, station</li>
        <li><strong>Electric side:</strong> Every charge — kWh, cost, kWh/100km, $/100km, station, connector</li>
        <li><strong>Blended view:</strong> Combined $/100km weighted by actual distance, EV% split (e.g. "68% electric")</li>
        <li><strong>ATO exports:</strong> One file with both fuel and charge sessions for work claims</li>
      </ul>
      <p>No other app in this comparison does this. If you drive a PHEV, you currently need an EV app for charging and a fuel app for petrol. AutoBrain unifies them.</p>
    </div>
