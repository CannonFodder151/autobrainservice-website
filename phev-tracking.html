    <h1>PHEV Tracking — <span class="b">One Dashboard for Plug-in Hybrids</span></h1>
    <p class="lead">Petrol fill-ups, charge sessions, electric-vs-petrol split, and combined $/100km — all on a single screen. The new vehicle powertrain enum (EV/HEV/PHEV/ICE) unlocks dual-source tracking for Australian PHEV owners.</p>
    <div class="u-flex-center u-mt-28">
      <a class="cta" href="mailto:sales@autobrainservice.app?subject=EV%20waitlist">Join the EV waitlist</a>
      <a class="cta-outline" href="coming-soon.html">See all coming features</a>
    </div>

    <div class="card u-mt-42">
      <h2>The problem PHEV owners face</h2>
      <p>Most apps force a choice: track petrol <em>or</em> track electric. But a plug-in hybrid uses both — sometimes in the same trip. You end up with two apps, two logbooks, and no real picture of what your car actually costs to run.</p>
      <p>AutoBrain solves this with a per-vehicle <strong>powertrain enum</strong> (EV / HEV / PHEV / ICE). Set your vehicle to PHEV and you get:</p>
      <ul>
        <li>Both fuel logging <strong>and</strong> charge logging enabled simultaneously</li>
        <li>A single combined dashboard — no switching between apps</li>
        <li>Real-world electric-vs-petrol distance split (e.g. "68% electric, 32% petrol")</li>
        <li>Blended $/100km across both energy sources</li>
        <li>ATO-compatible exports that include both fuel and electric fields</li>
      </ul>
    </div>

    <div class="card u-mt-28">
      <h2>What the PHEV dashboard shows</h2>
      <div class="grid">
        <div class="card">
          <span class="icon">⛽</span>
          <h3>Petrol side</h3>
          <p>Every fill-up: litres, cost, L/100km, $/km, station. The same fuel log book Australian drivers already trust — now alongside electric data.</p>
        </div>
        <div class="card">
          <span class="icon">🔌</span>
          <h3>Electric side</h3>
          <p>Every charge: kWh added, duration, cost, station, connector. kWh/100km and $/100km efficiency. Home vs public, AC vs DC — all tracked.</p>
        </div>
        <div class="card">
          <span class="icon">📊</span>
          <h3>Blended view</h3>
          <p>Combined $/100km weighted by actual distance. EV% distance split. Cost per km in EV mode vs petrol mode. The real cost of running your PHEV.</p>
        </div>
        <div class="card">
          <span class="icon">📋</span>
          <h3>ATO exports</h3>
          <p>One CSV/JSON with both fuel and charge sessions. Work-related EV charging and petrol claims in the same export. Same engine your fuel log book uses.</p>
        </div>
      </div>
    </div>

    <div class="card u-mt-28">
      <h2>OBD2 integration for PHEVs</h2>
      <p>With the recommended AutoBrain OBD2 adapter (or any ELM327 v1.4+), AutoBrain reads PHEV-specific PIDs where the vehicle supports them:</p>
      <ul>
        <li><strong>Battery state of charge (SoC)</strong> — live high-voltage pack percentage</li>
        <li><strong>EV mode distance</strong> — kilometres driven on electric only (from vehicle ECU)</li>
        <li><strong>Engine runtime vs motor runtime</strong> — how much the ICE actually ran</li>
        <li><strong>High-voltage battery temperature</strong> — thermal management insight</li>
        <li><strong>Charge/discharge power</strong> — real-time kW flow in/out of the pack</li>
      </ul>
      <p class="u-mt-14">These PIDs auto-populate the EV distance and engine distance fields, making the EV% split accurate without manual entry. Without an adapter, you can still log fill-ups and charges manually and enter the EV distance per trip.</p>
    </div>

    <div class="card u-mt-28">
      <h2>Existing fuel data stays put</h2>
      <p>Switching a vehicle's powertrain to PHEV is non-destructive:</p>
      <ul>
        <li>All historical fuel fill-ups remain unchanged and queryable</li>
        <li>Service records, receipts, parts, mods — all preserved</li>
        <li>Resale estimates, analytics, logbook exports — all continue working</li>
        <li>New electric fields simply appear alongside the existing petrol fields</li>
      </ul>
      <p class="u-mt-14">You don't migrate. You just start logging charges and the blended dashboard lights up.</p>
    </div>

    <div class="card u-mt-28">
      <h2>Frequently asked questions</h2>
      <div class="faq">
        <details>
          <summary>What is PHEV tracking in AutoBrain?</summary>
          <p>PHEV tracking gives plug-in hybrid owners a single combined dashboard that shows both petrol fill-ups and EV charge sessions side by side. You see your real-world electric-vs-petrol distance split, blended $/100km cost across both energy sources, and the same per-km cost tracking you already get for pure ICE vehicles — all on one screen.</p>
        </details>
        <details>
          <summary>How does the powertrain enum work?</summary>
          <p>Every vehicle in AutoBrain now has a powertrain setting: EV (battery-electric), HEV (conventional hybrid, no plug), PHEV (plug-in hybrid), or ICE (petrol/diesel only). This setting determines which logging fields appear, which efficiency metrics are calculated, and how the combined dashboard is rendered. PHEV owners get both fuel and charge logging enabled simultaneously.</p>
        </details>
        <details>
          <summary>Can I track electric and petrol costs separately and combined?</summary>
          <p>Yes. The PHEV dashboard shows three cost views: (1) Petrol only — L/100km and $/km from fuel fill-ups; (2) Electric only — kWh/100km and $/100km from charge sessions; (3) Blended — combined $/100km across both energy sources weighted by actual distance driven in each mode. You also see the EV% distance split (e.g. "68% electric, 32% petrol").</p>
        </details>
        <details>
          <summary>Does PHEV tracking work with OBD2?</summary>
          <p>Yes. AutoBrain reads PHEV-relevant OBD2 PIDs where available: battery state of charge, EV mode distance, engine runtime vs motor runtime, high-voltage battery temperature, and charge/discharge power. The recommended AutoBrain OBD2 adapter provides the most complete live data. Without an adapter, you can still log fill-ups and charges manually.</p>
        </details>
        <details>
          <summary>Are my existing fuel logs preserved when I switch a vehicle to PHEV?</summary>
          <p>Absolutely. The powertrain enum is a per-vehicle setting that only changes which input fields and metrics are shown going forward. Every existing fuel log stays exactly where it is. The new electric meters (charge sessions, kWh, EV distance) appear alongside your petrol history. ATO-compatible exports continue to include all the same fields they always have, plus the new electric fields.</p>
        </details>
        <details>
          <summary>Does the EV Log Book work for PHEVs?</summary>
          <p>Yes. The EV Log Book (kWh/100km, $/100km, per-charge cost) works for PHEV charge sessions exactly as it does for pure EVs. You log each charge — home wall box, public AC, public DC fast charger — and AutoBrain calculates the electric efficiency metrics. The petrol side continues to use the existing fuel log book (L/100km, $/km). Both feed into the blended dashboard.</p>
        </details>
        <details>
          <summary>When does PHEV support launch?</summary>
          <p>PHEV support is part of the EV feature rollout targeted for Q4 2026. The rollout order: Electric Spy (charging price watch) first, then EV Log Book (EV efficiency dashboard), then full PHEV dual-source support. Join the waitlist to be notified when PHEV tracking goes live.</p>
        </details>
        <details>
          <summary>Is PHEV tracking available on the free tier?</summary>
          <p>The free tier keeps basic PHEV vehicle creation and on-demand logging for both fuel and charge sessions. The full dual-source dashboard with blended metrics, EV% split, Electric Spy alerts, and the EV Log Book efficiency dashboard require the Enthusiast ($5.90/month or $59/year) or Garage ($11.90/month or $119/year) plans. Self-hosters get the full feature set free.</p>
        </details>
      </div>
    </div>
