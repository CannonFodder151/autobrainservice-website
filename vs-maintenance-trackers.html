    <div class="card u-mt-28">
      <h2>The fundamental difference</h2>
      <p><strong>myCARFAX, Drivvo, Fuelly, Car Minder, Simply Auto</strong> are <em>manual loggers</em>. You enter services, fill-ups, and expenses by hand. They're good at what they do — clean UIs, reminders based on time/km, export options. But they only know what you tell them.</p>
      <p><strong>AutoBrain</strong> is an <em>intelligence layer</em>. It combines manual logging with:</p>
      <ul>
        <li><strong>OBD2 live data</strong> — reads codes, streams PIDs, detects trends automatically</li>
        <li><strong>AI + deterministic predictive maintenance</strong> — alerts you before a code sets, works when AI is down</li>
        <li><strong>Australian rego lookup</strong> — free on-demand, paid daily Rego Status with expiry notifications</li>
        <li><strong>EV/PHEV dual-source tracking</strong> — petrol + electric on one dashboard (Q4 2026)</li>
        <li><strong>ATO-compliant GPS logbook</strong> — automatic trips with OBD2 adapter, or manual</li>
        <li><strong>Self-hosted option</strong> — MIT license, your VPS, your data, no subscription ever</li>
      </ul>
      <p>If you only need a manual logbook, the others are fine choices. If you want your car to <em>tell you</em> what it needs — before it breaks — AutoBrain is built for that.</p>
    </div>

    <div class="card u-mt-28">
      <h2>Australian-specific advantages</h2>
      <p>Every competitor above is either US-centric (myCARFAX) or global-generic (Drivvo, Fuelly, Simply Auto). AutoBrain is built for Australia:</p>
      <ul>
        <li><strong>Rego lookup:</strong> Enter a plate, get VIN, make, model, year, body, colour, current status — all states/territories</li>
        <li><strong>Rego Status (paid):</strong> Daily expiry refresh, colour-coded badge, 30/7/1 day notifications + instant expiry alert</li>
        <li><strong>Fuel math:</strong> L/100km and $/km natively, not MPG converted</li>
        <li><strong>Financial-year exports:</strong> July–June fuel and service summaries for tax</li>
        <li><strong>Repair costs:</strong> Australian labour rates ($120–$180/hr indie, $180–$250/hr dealer) and parts pricing</li>
        <li><strong>ATO logbook:</strong> GPS trips meeting ATO requirements, automatic with OBD2 adapter</li>
        <li><strong>Mechanic pricing:</strong> Australian workshop benchmarks, not US averages</li>
      </ul>
    </div>
