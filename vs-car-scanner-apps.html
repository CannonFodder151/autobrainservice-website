    <div class="card u-mt-28">
      <h2>The fundamental difference</h2>
      <p><strong>Torque Pro, Car Scanner ELM, OBD Auto Doctor</strong> are <em>OBD2 dashboard apps</em>. Their job: connect to an ELM327 adapter, show live PIDs, graph sensors, read/clear codes. They're excellent at this — highly customizable, deep PID support, great for enthusiasts who want to watch sensor data in real time.</p>
      <p><strong>AutoBrain</strong> is a <em>car ownership platform</em>. OBD2 is one input among many. AutoBrain combines:</p>
      <ul>
        <li>OBD2 live data + fault codes (same adapters, same PIDs)</li>
        <li>Fuel tracking with Australian L/100km, $/km, financial-year exports</li>
        <li>Service history with receipts, parts, labour, reminders</li>
        <li>Australian rego lookup (free on-demand + paid daily Rego Status)</li>
        <li>Predictive maintenance: AI + deterministic fallback (works when AI is down)</li>
        <li>Vehicle Health Score: one 0–100 number from OBD2 + service + driving patterns</li>
        <li>EV/PHEV support: dual-source tracking, Electric Spy, EV Log Book</li>
        <li>ATO logbook: GPS trips, automatic or manual</li>
        <li>Community Garage: federated social layer for builds, issues, help</li>
        <li>Self-hosted option: MIT license, your VPS, your data, no subscription</li>
      </ul>
      <p>If you only want an OBD2 dashboard, Torque/Car Scanner are great choices. If you want to <em>own</em> your car's data — maintenance, costs, health, history, predictions — in one place that you can self-host, AutoBrain is built for that.</p>
    </div>

    <div class="card u-mt-28">
      <h2>OBD2 compatibility: same adapters, same PIDs</h2>
      <p>AutoBrain works with any ELM327 v1.4+ adapter — the exact same hardware Torque Pro and Car Scanner ELM use:</p>
      <ul>
        <li>Bluetooth: Veepeak, OBDLink MX+, BAFX, generic $15–$40 units</li>
        <li>WiFi: OBDLink MX WiFi, generic ELM327 WiFi</li>
        <li>USB: OBDLink SX, generic ELM327 USB (via OTG on Android)</li>
      </ul>
      <p>AutoBrain reads the same standard PIDs (RPM, coolant temp, fuel trims, O2 voltage, MAF, MAP, throttle position, etc.) and supports custom PID definitions. The recommended AutoBrain OBD2 adapter adds auto-sleep (never drains your battery), on-board GPS for automatic trip logging, live fault-code capture, and odometer/VIN sync — but it's optional. Your existing adapter works perfectly.</p>
    </div>
