name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  build_and_deploy_job:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64]
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Regenerate changelog
        run: python3 scripts/gen_changelog.py
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"        # static site root
          api_location: ""         # no API
          output_location: ""      # static site content is the repo root
          skip_app_build: true     # plain static site — no Node/Oryx build

  build_and_deploy_pr_job:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64]
    name: Build and Deploy PR Preview Job
    steps:
      - uses: actions/checkout@v3
        with:
          submodules: true
          lfs: false
      - name: Regenerate changelog
        run: python3 scripts/gen_changelog.py
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"        # static site root
          api_location: ""         # no API
          output_location: ""      # static site content is the repo root
          skip_app_build: true     # plain static site — no Node/Oryx build

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    continue-on-error: true
    steps:
      - name: Close Pull Request (with retry)
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            echo "Attempt $attempt: Closing PR staging environment..."
            if npx -y azure-static-web-apps-deploy@latest close --token "$AZURE_STATIC_WEB_APPS_API_TOKEN"; then
              echo "Successfully closed PR staging environment"
              exit 0
            fi
            echo "Attempt $attempt failed, retrying in 10s..."
            sleep 10
          done
          echo "All retry attempts failed, but continuing (continue-on-error: true)"
          exit 0