# AUT-1798: x64 jobs dispatch to the new vm2 runner (gh-runner-autobrain-website-2). ARM stays on Oracle VM.
name: Azure Static Web Apps CI/CD

# AUT-1465: GITHUB_TOKEN defaulted to read-only, so the SWA action's
# staging-URL PR comment failed ("Unexpectedly failed to add GitHub comment").
permissions:
  contents: read
  pull-requests: write

on:
  push:
    branches:
      - main
  pull_request:
    # AUT-4799: 'closed' is required so a merged/closed PR releases its staging
    # environment immediately. Without it, slots are only reclaimed by the
    # nightly sweep and abandoned branches hold quota for up to 24h.
    types: [opened, synchronize, reopened, closed]
    branches:
      - main

jobs:
  close_preview_job:
    # Free the staging environment the moment a PR closes, so abandoned and
    # merged branches never hold preview quota (AUT-4799).
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Release PR Preview Environment Job
    # Own concurrency group: releasing must never queue behind, or displace,
    # an in-flight upload (AUT-1350).
    concurrency:
      group: swa-preview-close-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          submodules: true
          lfs: false
      - name: Release staging environment
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "close"
          app_location: "/"        # static site root
          api_location: ""         # no API
          output_location: ""      # static site content is the repo root

  build_and_deploy_job:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # App-wide staging quota: serialize uploads (AUT-1350). Job-level so the
    # merge-triggered close job can never displace a queued main deploy.
    concurrency:
      group: swa-upload
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          submodules: true
          lfs: false
      - name: Regenerate changelog
        run: python3 scripts/gen_changelog.py
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"        # static site root
          api_location: ""         # no API
          output_location: ""      # static site content is the repo root
          skip_app_build: true     # plain static site — no Node/Oryx build
      - name: Build And Deploy (retry)
        # Azure intermittently rejects uploads with a spurious "max staging
        # environments" BadRequest during merge-time bursts (AUT-1350);
        # an immediate retry has succeeded every time.
        if: failure() && steps.builddeploy.outcome == 'failure'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"        # static site root
          api_location: ""         # no API
          output_location: ""      # static site content is the repo root
          skip_app_build: true     # plain static site — no Node/Oryx build

  build_and_deploy_pr_job:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    name: Build and Deploy PR Preview Job
    concurrency:
      group: swa-upload
      cancel-in-progress: false
    # AUT-4799: the free plan allows only 3 preview environments and this repo
    # routinely has more than 3 open PRs, so Azure rejects the upload with
    # "This Static Web App already has the maximum number of staging
    # environments". A preview URL is a review convenience, not a correctness
    # gate, so it must not block review or merge.
    continue-on-error: true
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3
        with:
          submodules: true
          lfs: false
      - name: Fetch trusted reclaim script
        # Never execute PR-head code with AZURE_STATIC_WEB_APPS_API_TOKEN in its
        # environment: that token can upload to production. Run the copy that
        # QA + Security reviewed on the default branch.
        env:
          TRUSTED_REF: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags --depth=1 origin "$TRUSTED_REF"
          mkdir -p "$RUNNER_TEMP/reclaim"
          git archive FETCH_HEAD \
            scripts/swa_preview_reclaim.py \
            scripts/swa_dataplane_cleanup.py \
            | tar -x -C "$RUNNER_TEMP/reclaim"
      - name: Reclaim a preview slot
        # The cap counts environments, not open PRs, so eviction targets only
        # PRs whose staging URL is actually live, LRU-first. Waits for each
        # release to take effect. Never blocks the deploy (AUT-4799).
        # continue-on-error is required at STEP level: main() only wraps the
        # victim loop in try/finally, so a GhAuthError/URLError/missing env var
        # raised earlier propagates and fails the step. Job-level
        # continue-on-error only neutralises the job conclusion - it does not
        # stop the default `if: success()` guard from skipping *Regenerate
        # changelog* and *Build And Deploy* below.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          CURRENT_PR: ${{ github.event.pull_request.number }}
          PREVIEW_LIMIT: 3
          GITHUB_WORKSPACE: ${{ runner.temp }}/reclaim   # keep event payloads out of app_location
        run: python3 "$RUNNER_TEMP/reclaim/scripts/swa_preview_reclaim.py"
      - name: Regenerate changelog
        run: python3 scripts/gen_changelog.py
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"        # static site root
          api_location: ""         # no API
          output_location: ""      # static site content is the repo root
          skip_app_build: true     # plain static site — no Node/Oryx build
      - name: Build And Deploy (retry)
        # Azure intermittently rejects uploads with a spurious "max staging
        # environments" BadRequest during merge-time bursts (AUT-1350);
        # an immediate retry has succeeded every time.
        if: failure() && steps.builddeploy.outcome == 'failure'
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"        # static site root
          api_location: ""         # no API
          output_location: ""      # static site content is the repo root
          skip_app_build: true     # plain static site — no Node/Oryx build
