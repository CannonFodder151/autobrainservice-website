name: SWA Close Stale Env

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to close environment for"
        required: true
        type: integer

permissions:
  contents: read
  pull-requests: read

jobs:
  close:
    runs-on: [self-hosted, linux, x64]
    steps:
      - name: Close stale staging environment
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_HAPPY_GLACIER_0F26AF910 }}
          action: "close"
          repo_token: ${{ secrets.GITHUB_TOKEN }}
        env:
          GITHUB_EVENT_NUMBER: ${{ inputs.pr_number }}
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_ACTION: closed
