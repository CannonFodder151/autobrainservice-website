name: Azure SWA Staging Cleanup

on:
  schedule:
    - cron: '0 3 * * *'  # daily 03:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  cleanup-staging:
    runs-on: [self-hosted, linux, x64]
    name: Cleanup Stale Staging Environments
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          lfs: false

      - name: Verify Azure credentials
        id: check-creds
        run: |
          if [ -n "${{ secrets.AZURE_CLIENT_ID }}" ] && [ -n "${{ secrets.AZURE_TENANT_ID }}" ] && [ -n "${{ secrets.AZURE_SUBSCRIPTION_ID }}" ]; then
            echo "has_oidc=true" >> $GITHUB_OUTPUT
            echo "OIDC secrets found - will use federated login"
          elif [ -n "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "has_creds=true" >> $GITHUB_OUTPUT
            echo "AZURE_CREDENTIALS found - will use service principal login"
          else
            echo "has_oidc=false" >> $GITHUB_OUTPUT
            echo "has_creds=false" >> $GITHUB_OUTPUT
            echo "No Azure credentials found - skipping cleanup"
          fi

      - name: Login to Azure (OIDC)
        if: steps.check-creds.outputs.has_oidc == 'true'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          auth-type: OIDC

      - name: Login to Azure (Service Principal)
        if: steps.check-creds.outputs.has_creds == 'true'
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: List and delete stale staging environments (>7 days)
        if: steps.check-creds.outputs.has_oidc == 'true' || steps.check-creds.outputs.has_creds == 'true'
        env:
          AZURE_STATIC_WEB_APPS_API_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -euo pipefail
          TOKEN_RAW="${AZURE_STATIC_WEB_APPS_API_TOKEN}"
          if [[ "$TOKEN_RAW" == */* ]]; then
            APP_NAME="${TOKEN_RAW%%/*}"
          else
            APP_NAME="happy-glacier-0f26af910"
          fi
          RESOURCE_GROUP=$(az staticwebapp show -n "$APP_NAME" --query resourceGroup -o tsv 2>/dev/null || echo "autobrainservice-rg")
          
          echo "Cleaning staging envs for app: $APP_NAME in RG: $RESOURCE_GROUP"
          
          az staticwebapp environment list \
            --name "$APP_NAME" \
            --resource-group "$RESOURCE_GROUP" \
            --query "[?type=='staging'].{name:name, created:createdTime}" -o tsv | \
          while IFS=$'\t' read -r env_name created; do
            if [ -z "$env_name" ]; then continue; fi
            epoch_created=$(date -d "$created" +%s 2>/dev/null || date -j -f "%Y-%m-%dT%H:%M:%S" "$created" +%s 2>/dev/null || echo 0)
            epoch_now=$(date +%s)
            age_days=$(( (epoch_now - epoch_created) / 86400 ))
            if [ "$epoch_created" -gt 0 ] && [ "$age_days" -gt 7 ]; then
              echo "Deleting stale env: $env_name (age: ${age_days}d)"
              az staticwebapp environment delete --name "$APP_NAME" --resource-group "$RESOURCE_GROUP" --environment-name "$env_name" --yes || true
            else
              echo "Keeping env: $env_name (age: ${age_days}d)"
            fi
          done

      - name: Skip cleanup - no credentials
        if: steps.check-creds.outputs.has_creds == 'false' && steps.check-creds.outputs.has_oidc == 'false'
        run: |
          echo "::warning::No Azure credentials configured (AZURE_CLIENT_ID/TENANT_ID/SUBSCRIPTION_ID for OIDC, or AZURE_CREDENTIALS for SP). Skipping cleanup."
          echo "Configure OIDC federated credentials in Entra ID for this repo, or add AZURE_CREDENTIALS secret, to enable automated cleanup."
