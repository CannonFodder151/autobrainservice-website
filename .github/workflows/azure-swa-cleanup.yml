name: Azure SWA Staging Cleanup

on:
  schedule:
    - cron: '0 3 * * *'  # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dispatch runs: probe + list planned purges only'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: swa-cleanup
  cancel-in-progress: false

jobs:
  cleanup-staging:
    runs-on: [self-hosted, linux, x64]
    name: Purge orphaned staging environments (SWA data plane)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Probe data plane and sweep closed-PR preview environments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
        run: python3 scripts/swa_dataplane_cleanup.py

      - name: Debug single close (dispatch only)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run != true
        env:
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        run: |
          set -x
          echo '{"event_name":"pull_request","action":"closed","pull_request":{"number":7}}' > /tmp/event7.json
          docker run --rm \
            -e INPUT_ACTION=close \
            -e INPUT_AZURE_STATIC_WEB_APPS_API_TOKEN="$SWA_TOKEN" \
            -e GITHUB_EVENT_PATH=/w/event.json \
            -e GITHUB_EVENT_NAME=pull_request \
            -e GITHUB_WORKSPACE=/w \
            -e GITHUB_REPOSITORY="$GITHUB_REPOSITORY" \
            -v /tmp/event7.json:/w/event.json \
            mcr.microsoft.com/appsvc/staticappsclient:stable 2>&1 | tail -40
          echo "exit=$?"
          docker run --rm mcr.microsoft.com/appsvc/staticappsclient:stable sh -c "ls -la /bin/staticsites/ | head -8; cd /bin/staticsites && ./StaticSitesClient 2>&1 | head -20; echo inner_exit=\$?"
