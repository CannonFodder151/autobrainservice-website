# AUT-3718 moved this to GitHub-hosted runners (ubuntu-latest) and off
# the self-hosted vm2 runner (gh-runner-autobrain-website-2). ARM stays on
# Oracle VM.
# AUT-5654: AUT-3718's premise is gone. The account's hosted-runner
# spending limit is exhausted, so an ubuntu-latest job never starts — it
# fails in 3-6s with zero steps and the annotation "The job was not
# started because recent account payments have failed or your spending
# limit needs to be increased". The cleanup is schedule + workflow_dispatch
# only (trusted code) and the runner is repo-dedicated and idle, so this
# returns to the self-hosted vm2 runner that AUT-3718 moved it off.
name: Azure SWA Staging Cleanup

on:
  schedule:
    - cron: '0 3 * * *'  # daily 03:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dispatch runs: probe + list planned purges only'
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: swa-cleanup
  cancel-in-progress: false

jobs:
  cleanup-staging:
    runs-on: [self-hosted, Linux, X64]
    name: Purge orphaned staging environments (SWA data plane)
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Self-check cleanup script
        run: python3 scripts/test_swa_dataplane_cleanup.py

      - name: Sweep closed-PR preview environments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SWA_TOKEN: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
        run: python3 scripts/swa_dataplane_cleanup.py
