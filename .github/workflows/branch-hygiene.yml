name: Branch Hygiene

on:
  schedule:
    - cron: '0 4 * * *'  # daily 04:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dispatch runs: list planned actions only'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

jobs:
  hygiene:
    runs-on: [self-hosted, linux, x64]
    name: Close stale PRs and delete stale branches
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Sweep stale branches (warn first, then close + delete)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true && 'true' || 'false' }}
        run: python3 scripts/branch_hygiene.py
