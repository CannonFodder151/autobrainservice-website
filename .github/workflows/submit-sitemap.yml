name: Submit Sitemap to Search Engines

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitemap.xml'
      - 'blog/**'

jobs:
  submit-sitemap:
    name: Submit sitemap via IndexNow
    runs-on: [self-hosted, Linux, X64]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Submit sitemap via IndexNow
        if: env.INDEXNOW_KEY != ''
        run: |
          KEY="${{ secrets.INDEXNOW_KEY }}"
          KEY_FILE="${KEY}.txt"
          SITEMAP_URL="https://autobrainservice.app/sitemap.xml"
          KEY_URL="https://autobrainservice.app/${KEY_FILE}"

          echo "Submitting sitemap to IndexNow..."
          echo "Key: $KEY"
          echo "Key URL: $KEY_URL"
          echo "Sitemap: $SITEMAP_URL"

          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST "https://api.indexnow.org/IndexNow" \
            -H "Content-Type: application/json" \
            -d "{\"host\":\"autobrainservice.app\",\"key\":\"$KEY\",\"keyLocation\":\"$KEY_URL\",\"urlList\":[\"$SITEMAP_URL\"]}")

          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | head -n-1)

          echo "Response: $BODY"
          echo "HTTP Status: $HTTP_CODE"

          if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "202" ]; then
            echo "✅ Sitemap submitted successfully via IndexNow"
          else
            echo "❌ Failed to submit sitemap (HTTP $HTTP_CODE)"
            exit 1
          fi
        env:
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}

      - name: Ping Google Search Console (deprecated endpoint - for reference)
        if: false
        run: |
          echo "Note: Google sitemap ping endpoint is deprecated (June 2023)."
          echo "Use Google Search Console API or IndexNow for modern submission."
          echo "Sitemap is referenced in robots.txt and will be discovered naturally."

      - name: Notify via n8n Discord Reporter
        if: always() && env.N8N_WEBHOOK_URL != ''
        run: |
          STATUS="${{ job.status }}"
          COLOR="0x57F287"
          if [ "$STATUS" != "success" ]; then COLOR="0xED4245"; fi
          curl -s -X POST "${{ secrets.N8N_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"channel\":\"status\",\"title\":\"Sitemap submitted via IndexNow\",\"description\":\"Sitemap.xml submitted to search engines via IndexNow protocol.\",\"color\":\"$COLOR\",\"author\":\"SEO Bot\",\"fields\":[{\"name\":\"Status\",\"value\":\"$STATUS\",\"inline\":true},{\"name\":\"Sitemap\",\"value\":\"https://autobrainservice.app/sitemap.xml\",\"inline\":true}]}"
        env:
          N8N_WEBHOOK_URL: ${{ secrets.N8N_DISCORD_WEBHOOK_URL }}