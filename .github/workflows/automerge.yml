name: automerge

on:
  pull_request_review:
    types: [submitted]
  pull_request:
    types: [ready_for_review]
  issue_comment:
    types: [created]
  check_run:
    types: [completed]
  status:

permissions:
  contents: write
  pull-requests: read
  issues: read
  checks: read
  statuses: read

jobs:
  automerge:
    if: github.event_name != 'check_run' || github.event.check_run.name != 'automerge'
    runs-on: ubuntu-latest
    steps:
      - name: Resolve pull request
        id: pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PULL_REQUEST: ${{ github.event.pull_request.number }}
          EVENT_COMMENT_ON_PR: ${{ github.event.issue.pull_request.url }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          PR=""
          case "$EVENT_NAME" in
            issue_comment)
              # approval markers are PR comments; plain issue comments are ignored
              if [ -n "$EVENT_COMMENT_ON_PR" ]; then PR="${{ github.event.issue.number }}"; fi
              ;;
            pull_request_review|pull_request)
              PR="$EVENT_PULL_REQUEST"
              ;;
            *)
              PR="$(gh api "repos/$REPO/commits/$EVENT_SHA/pulls" --jq '.[0].number // empty' || true)"
              ;;
          esac
          echo "pr=$PR" >> "$GITHUB_OUTPUT"

      - name: Squash-merge approved PR
        if: steps.pr.outputs.pr != ''
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          REPO="${{ github.repository }}"
          PR="${{ steps.pr.outputs.pr }}"
          DEFAULT="$(gh api "repos/$REPO" --jq '.default_branch')"
          DATA="$(gh api "repos/$REPO/pulls/$PR")"

          BASE="$(echo "$DATA" | jq -r '.base.ref')"
          if [ "$BASE" != "$DEFAULT" ]; then echo "skip: base '$BASE' is not '$DEFAULT'"; exit 0; fi
          if [ "$(echo "$DATA" | jq '.draft')" = "true" ]; then echo "skip: draft PR"; exit 0; fi
          STATE="$(echo "$DATA" | jq -r '.mergeable_state')"
          if [ "$STATE" != "clean" ]; then echo "skip: mergeable_state=$STATE"; exit 0; fi

          HEAD_SHA="$(echo "$DATA" | jq -r '.head.sha')"
          CMP="$(gh api "repos/$REPO/compare/$DEFAULT...$HEAD_SHA" --jq '[.status, .ahead_by, .behind_by]')"
          C_STATUS="$(echo "$CMP" | jq -r '.[0]')"
          C_AHEAD="$(echo "$CMP" | jq -r '.[1]')"
          C_BEHIND="$(echo "$CMP" | jq -r '.[2]')"
          if [ "$C_STATUS" != "ahead" ]; then
            echo "skip: head $HEAD_SHA is not based on current $DEFAULT (compare status=$C_STATUS ahead_by=$C_AHEAD behind_by=$C_BEHIND) — merge $DEFAULT into the head branch first"
            exit 0
          fi

          # Dual sign-off: require BOTH Code Reviewer AND Critical Reviewer approval.
          # Uses Paperclip-attributed approval marker comments (AUT-5401):
          #   <!-- paperclip-approve-code-reviewer: AUT-1234 run: 34fc57cc-... -->
          #   <!-- paperclip-approve-critical-reviewer: AUT-1234 run: 34fc57cc-... -->
          # Each must come from the owning account, have a run id different from
          # the opening run stamped in the PR body, and be from a distinct role.
          OWNER="$(echo "$REPO" | cut -d/ -f1)"
          COMMENTS="$(gh api "repos/$REPO/issues/$PR/comments?per_page=100" || echo '[]')"
          OPEN_RUN="$(echo "$DATA" | jq -r '.body // ""' | grep -oE 'paperclip-run:[[:space:]]*[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | grep -oE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' | head -1 || true)"
          if [ -z "$OPEN_RUN" ]; then
            echo "skip: PR body carries no paperclip-run stamp; dual sign-off not checkable"
            exit 0
          fi

          RUN_ID_RE='[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

          CODE_MARKER="$(echo "$COMMENTS" | jq -r --arg owner "$OWNER" '[.[] | select(.user.login == $owner) | select(.body | test("paperclip-approve-code-reviewer:"))] | last | (.body // "")')"
          CODE_RUN="$(printf '%s' "$CODE_MARKER" | grep -oE "$RUN_ID_RE" | head -1 || true)"
          if [ -z "$CODE_RUN" ]; then
            echo "skip: no paperclip-approve-code-reviewer marker from $OWNER"
            exit 0
          fi
          if [ "$CODE_RUN" = "$OPEN_RUN" ]; then
            echo "skip: code-reviewer approval marker is from the same Paperclip run that opened the PR ($OPEN_RUN)"
            exit 0
          fi

          CRITICAL_MARKER="$(echo "$COMMENTS" | jq -r --arg owner "$OWNER" '[.[] | select(.user.login == $owner) | select(.body | test("paperclip-approve-critical-reviewer:"))] | last | (.body // "")')"
          CRITICAL_RUN="$(printf '%s' "$CRITICAL_MARKER" | grep -oE "$RUN_ID_RE" | head -1 || true)"
          if [ -z "$CRITICAL_RUN" ]; then
            echo "skip: no paperclip-approve-critical-reviewer marker from $OWNER"
            exit 0
          fi
          if [ "$CRITICAL_RUN" = "$OPEN_RUN" ]; then
            echo "skip: critical-reviewer approval marker is from the same Paperclip run that opened the PR ($OPEN_RUN)"
            exit 0
          fi

          if [ "$CODE_RUN" = "$CRITICAL_RUN" ]; then
            echo "skip: both approvals from the same Paperclip run ($CODE_RUN); dual sign-off requires distinct runs"
            exit 0
          fi

          echo "approve: code-reviewer marker from run $CODE_RUN, critical-reviewer marker from run $CRITICAL_RUN, opening run $OPEN_RUN"

          if echo "$DATA" | jq -e '[.labels[].name] | index("hold") != null' >/dev/null; then echo "skip: 'hold' label set"; exit 0; fi

          ROLLUP="$(gh api "repos/$REPO/pulls/$PR" --jq '[.statusCheckRollup[]?.conclusion] | all(. == "SUCCESS" or . == "SKIPPED" or . == "NEUTRAL")')"
          if [ "$ROLLUP" != "true" ]; then echo "skip: status checks not green"; exit 0; fi

          gh pr merge "$PR" --repo "$REPO" --squash --delete-branch --match-head-commit "$HEAD_SHA" || echo "merge not performed (already merged, head moved, or transient conflict)"