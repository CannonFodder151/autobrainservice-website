    <h1>Electric Spy — <span class="b">EV Charging Price Watch</span></h1>
    <p class="lead">Star your favourite chargers, pick connector type and network, set a price-per-kWh move threshold. Electric Spy pings you the moment a station's price crosses your line. Live WA & QLD feeds, more states coming.</p>
    <div class="u-flex-center u-mt-28">
      <a class="cta" href="mailto:sales@autobrainservice.app?subject=EV%20waitlist">Join the EV waitlist</a>
      <a class="cta-outline" href="coming-soon.html">See all coming features</a>
    </div>

    <div class="card u-mt-42">
      <h2>How it works</h2>
      <div class="grid">
        <div class="card">
          <span class="icon">1️⃣</span>
          <h3>Build your watchlist</h3>
          <p>Browse the map or list of charging stations. Tap the star on any charger to add it. Filter by connector (CCS2, CHAdeMO, Type 2, Tesla), network (Chargefox, Evie, Tesla, Jolt, NRMA, etc.), and state.</p>
        </div>
        <div class="card">
          <span class="icon">2️⃣</span>
          <h3>Set your thresholds</h3>
          <p>For each starred charger, choose: \"Notify me if price drops more than X¢/kWh\" or \"Alert if price rises above Y¢/kWh\". Different thresholds per charger, per connector.</p>
        </div>
        <div class="card">
          <span class="icon">3️⃣</span>
          <h3>Get alerted</h3>
          <p>Electric Spy polls live feeds on the same schedule as Servo Spy. The moment a watched station's price crosses your threshold, you get a push notification (and/or email, in-app) — just like Servo Spy for fuel.</p>
        </div>
        <div class="card">
          <span class="icon">4️⃣</span>
          <h3>Plan your charge</h3>
          <p>Open the alert, see the new price, compare nearby starred chargers, and pick the cheapest option. Electric Spy integrates with the EV Log Book so every charge session auto-logs with cost and kWh.</p>
        </div>
      </div>
    </div>

    <div class="card u-mt-28">
      <h2>Live data sources</h2>
      <p>Electric Spy uses the same state-by-state feed architecture as Servo Spy — official government feeds first, partner feeds where official doesn't exist:</p>
      <div class="grid">
        <div class="card">
          <div class="tier-tag" style="background: var(--ok);">Live</div>
          <h3>Western Australia</h3>
          <p>Official government FuelWatch feed extended to EV charging stations. Comprehensive coverage of public chargers across WA.</p>
        </div>
        <div class="card">
          <div class="tier-tag" style="background: var(--ok);">Live</div>
          <h3>Queensland</h3>
          <p>Fuel Prices QLD partner feed covering major networks (Chargefox, Evie, Tesla Superchargers, Jolt, NRMA) across QLD.</p>
        </div>
        <div class="card">
          <div class="soon u-badge-static">Pending</div>
          <h3>New South Wales</h3>
          <p>Awaiting partner-feed API key issuance. Major networks: Chargefox, Evie, Tesla, NRMA, Jolt, BP Pulse.</p>
        </div>
        <div class="card">
          <div class="soon u-badge-static">Pending</div>
          <h3>Victoria</h3>
          <p>Awaiting partner-feed API key. Networks: Chargefox, Evie, Tesla, Jolt, Ampol, BP Pulse, NRMA.</p>
        </div>
        <div class="card">
          <div class="soon u-badge-static">Pending</div>
          <h3>ACT</h3>
          <p>Awaiting partner-feed API key. Networks: Chargefox, Evie, Tesla, Jolt, NRMA.</p>
        </div>
        <div class="card">
          <div class="soon u-badge-static">Future</div>
          <h3>Other states</h3>
          <p>SA, NT, TAS — feed availability under investigation. Self-hosters can wire any feed with an API key.</p>
        </div>
      </div>
    </div>

    <div class="card u-mt-28">
      <h2>Integration with EV Log Book</h2>
      <p>Electric Spy doesn't exist in isolation — it feeds directly into the EV Log Book:</p>
      <ul>
        <li><strong>Charge session auto-log:</strong> When you charge at a watched station, the session (kWh, duration, cost, station, connector) appears in your EV Log Book automatically.</li>
        <li><strong>$/100 km & kWh/100 km:</strong> Every charge updates your real-world efficiency metrics — home vs public, AC vs DC, time-of-use tariff aware.</li>
        <li><strong>Per-charge breakdown:</strong> Energy added, duration, cost, station name, connector type — all in one timeline.</li>
        <li><strong>ATO-compatible exports:</strong> Same export engine as the fuel log book. Work-related EV charging is claimable with the same CSV/JSON exports.</li>
      </ul>
    </div>

    <div class="card u-mt-28">
      <h2>Route planning with charge cost</h2>
      <p>Enter a destination and Electric Spy shows you the route with charging stops optimised for:</p>
      <ul>
        <li><strong>Lowest total cost</strong> — picks the cheapest compatible chargers along your route</li>
        <li><strong>Fastest overall time</strong> — balances charge speed vs detour distance</li>
        <li><strong>Preferred networks</strong> — prioritises your starred networks and connector types</li>
        <li><strong>Real-time availability</strong> — where feed data includes stall status (WA/QLD)</li>
      </ul>
      <p class="u-mt-14">Route planning uses your vehicle's real-world consumption from the EV Log Book, not WLTP figures.</p>
    </div>

    <div class="card u-mt-28">
      <h2>Plans & availability</h2>
      <div class="grid">
        <div class="card">
          <div class="tier-tag">Free</div>
          <h3>EV basics only</h3>
          <p>Add EV/PHEV vehicle, log charge sessions manually. No Electric Spy alerts, no efficiency dashboard, no route planning.</p>
        </div>
        <div class="card popular">
          <div class="tier-tag">Enthusiast · $5.90/mo</div>
          <h3>Full Electric Spy</h3>
          <p>Live price alerts, watchlist, route planning, full EV Log Book dashboard, PHEV dual-source. 7-day free trial.</p>
        </div>
        <div class="card popular">
          <div class="tier-tag">Garage · $11.90/mo</div>
          <h3>Up to 5 vehicles</h3>
          <p>Everything in Enthusiast across 5 vehicles. Each vehicle gets its own watchlist and EV Log Book.</p>
        </div>
        <div class="card">
          <div class="tier-tag">Self-Hosted</div>
          <h3>Full feature set free</h3>
          <p>MIT-licensed. Provide your own charging-feed API keys. Same Celery beat schedule, your infrastructure.</p>
        </div>
      </div>
    </div>

    <div class="card u-mt-28">
      <h2>Frequently asked questions</h2>
      <div class="faq">
        <details>
          <summary>What is Electric Spy?</summary>
          <p>Electric Spy is the EV cousin of AutoBrain's Servo Spy fuel price watch. You star your favourite charging stations, pick the connector types and networks you use, set a custom price-per-kWh move threshold, and Electric Spy notifies you the moment a station's price rises or drops past your line. Live pricing comes from the same state-by-state feed approach that powers Servo Spy — official government feeds plus partner feeds.</p>
        </details>
        <details>
          <summary>Which Australian states have live charging prices?</summary>
          <p>Western Australia via the official government FuelWatch feed (extended to EV chargers), and Queensland via the Fuel Prices QLD partner feed. New South Wales, ACT and Victoria are pending as partner-feed API keys are issued. The architecture is state-agnostic — each state lights up as its feed becomes available.</p>
        </details>
        <details>
          <summary>How do I set up price alerts?</summary>
          <p>In the Electric Spy tab, browse the map or list of stations. Tap the star on any charger to add it to your watchlist. For each starred charger, choose the connector type (CCS2, CHAdeMO, Type 2, Tesla), the network, and your threshold — e.g. "notify me if price drops more than 5¢/kWh" or "alert if price rises above 60¢/kWh". Notifications use your existing AutoBrain notification settings (push, email, in-app).</p>
        </details>
        <details>
          <summary>Does Electric Spy work with home charging?</summary>
          <p>Electric Spy tracks public charging stations from live feeds. Home charging costs are tracked separately in the EV Log Book — you enter your home electricity rate (or time-of-use tariff) and AutoBrain calculates $/100 km for home charges alongside public sessions.</p>
        </details>
        <details>
          <summary>Can self-hosters use Electric Spy?</summary>
          <p>Yes. Self-hosted AutoBrain includes the same Electric Spy code path. You provide your own charging-feed API keys (WA government, Fuel Prices QLD, or other sources) in the environment configuration, and the existing Celery beat schedule polls the feeds and triggers alerts on your infrastructure.</p>
        </details>
        <details>
          <summary>When does Electric Spy launch?</summary>
          <p>Electric Spy is targeted for Q4 2026 as part of the EV feature rollout. It will ship in waves: Electric Spy first, then the EV Log Book efficiency dashboard, then full PHEV dual-source support. Join the waitlist to be notified the day it lands.</p>
        </details>
        <details>
          <summary>Is Electric Spy free?</summary>
          <p>The free tier keeps basic EV vehicle creation and on-demand charge logging. Live Electric Spy price alerts, the full EV Log Book efficiency dashboard, and PHEV dual-source tracking are available on the Enthusiast ($5.90/month or $59/year) and Garage ($11.90/month or $119/year) hosted plans. Self-hosters get the full feature set free with their own feed API keys.</p>
        </details>
      </div>
    </div>
