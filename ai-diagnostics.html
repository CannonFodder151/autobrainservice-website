    <h1>AI Diagnostics — <span class="b">Symptoms & Codes to Plain-English Answers</span></h1>
    <p class="lead">Describe a symptom or paste an OBD2 code. Get likely causes, severity, affected parts, and Australian repair cost estimates. Works with deterministic fallback — so diagnostics stay available even when the AI is down.</p>
    <div class="u-flex-center u-mt-28">
      <a class="cta" href="https://hosted.autobrainservice.app">Try it free</a>
      <a class="cta-outline" href="https://demo.autobrainservice.app">Live demo</a>
    </div>

    <div class="card u-mt-42">
      <h2>Two ways to diagnose</h2>
      <div class="grid">
        <div class="card">
          <span class="icon">🗣️</span>
          <h3>Describe the symptom</h3>
          <p>Type what you see, hear, smell or feel: "car shakes at 60km/h", "burning smell from engine bay", "rough idle when cold", "brake pedal feels spongy". AutoBrain matches symptoms to likely causes.</p>
        </div>
        <div class="card">
          <span class="icon">📟</span>
          <h3>Paste the OBD2 code</h3>
          <p>Scan with any ELM327 adapter or enter manually: P0300, P0420, P0171, B1001, C1234. Get plain-English meaning, severity, affected parts, and Australian cost range.</p>
        </div>
      </div>
    </div>

    <div class="card u-mt-28">
      <h2>What you get back</h2>
      <div class="grid">
        <div class="card">
          <h3>Likely causes (ranked)</h3>
          <p>Top 3–5 causes ordered by probability for your vehicle make/model/year. Based on Australian repair data patterns.</p>
        </div>
        <div class="card">
          <h3>Severity rating</h3>
          <p><strong>Low</strong> — monitor, no urgency<br><strong>Medium</strong> — schedule within weeks<br><strong>High</strong> — address within days<br><strong>Critical</strong> — stop driving, immediate risk</p>
        </div>
        <div class="card">
          <h3>Affected parts</h3>
          <p>Specific components: "ignition coil #3", "front left brake rotor", "thermostat housing", "EVAP purge valve". Helps you buy the right part or brief your mechanic.</p>
        </div>
        <div class="card">
          <h3>Australian cost estimate</h3>
          <p>Parts + labour range for independent vs dealer workshops in Australia. E.g. "Alternator: $400–$900 incl. labour". Tracks your actual spend for future accuracy.</p>
        </div>
      </div>
    </div>

    <div class="card u-mt-28">
      <h2>Deterministic-first: works when AI is down</h2>
      <p>AutoBrain's Phase 1 architecture runs every feature on a rule-based path first. For diagnostics:</p>
      <ol>
        <li><strong>Rule-based lookup</strong> executes immediately — curated Australian repair knowledge base matches your symptom/code to causes, severity, parts, cost range.</li>
        <li><strong>AI enrichment</strong> (when reachable) adds pattern recognition across your vehicle's history: "this P0300 appeared 3 months ago and was coil #2", "your coolant trend suggests thermostat".</li>
        <li><strong>Result</strong> — you always get a complete answer. If AI is unreachable, the rule-based answer stands alone with full utility.</li>
      </ol>
      <p class="u-mt-14">No blank screens. No "try again later." No feature that becomes a gamble. <a href="blog/ai-that-works-even-when-the-ai-is-down.html">Read the architecture deep-dive →</a></p>
    </div>

    <div class="card u-mt-28">
      <h2>Built-in OBD2 code library</h2>
      <p>AutoBrain includes a searchable library of every standard OBD2 code plus manufacturer-specific codes for Australian-market vehicles:</p>
      <ul>
        <li><strong>Generic powertrain (P0xxx, P2xxx, P3xxx)</strong> — all standard codes</li>
        <li><strong>Body (B0xxx)</strong> — airbags, climate, lighting, doors</li>
        <li><strong>Chassis (C0xxx)</strong> — ABS, stability, suspension, steering</li>
        <li><strong>Network (U0xxx)</strong> — CAN bus, module communication</li>
        <li><strong>Manufacturer-specific</strong> — Toyota, Ford, Holden, Mazda, Hyundai, Kia, Mitsubishi, Nissan, Subaru, VW, and more</li>
      </ul>
      <p class="u-mt-14">Each code entry includes: plain-English description, common causes for Australian conditions, typical repair cost range, and related codes.</p>
    </div>

    <div class="card u-mt-28">
      <h2>Diagnostic history & trends</h2>
      <p>Every diagnostic session is saved to your vehicle's timeline:</p>
      <ul>
        <li>Symptom or code entered</li>
        <li>Causes returned (ranked)</li>
        <li>Severity at time of diagnosis</li>
        <li>What you actually did (replaced part, cleared code, monitored)</li>
        <li>Actual cost vs estimate</li>
      </ul>
      <p class="u-mt-14">Over time this builds a diagnostic fingerprint for your car. Recurring codes, intermittent faults, and "fixed but came back" patterns become visible — helping you and your mechanic catch root causes, not just symptoms.</p>
    </div>

    <div class="card u-mt-28">
      <h2>Integration with predictive maintenance</h2>
      <p>AI Diagnostics doesn't exist in isolation. With an OBD2 adapter connected:</p>
      <ul>
        <li><strong>Vehicle Health Score</strong> incorporates diagnostic history into the 0–100 rating</li>
        <li><strong>Trend alerts</strong> fire when sensor data suggests a component is degrading (before a code sets)</li>
        <li><strong>Service predictions</strong> use fault code history + sensor trends + service intervals</li>
        <li><strong>Resale estimates</strong> factor in documented diagnostic history</li>
      </ul>
      <p class="u-mt-14"><a href="vehicle-health-score.html">See Vehicle Health Score →</a> | <a href="blog/predictive-maintenance-car-ai-diagnostics.html">Read predictive maintenance guide →</a></p>
    </div>

    <div class="card u-mt-28">
      <h2>Frequently asked questions</h2>
      <div class="faq">
        <details>
          <summary>How does AutoBrain AI Diagnostics work?</summary>
          <p>You describe a symptom in plain English (e.g. "car shakes at 60km/h", "burning smell from engine bay") or paste an OBD2 fault code (e.g. P0300, P0420). AutoBrain's AI analyses your input against its training on Australian repair data and returns: likely causes ranked by probability, severity rating, affected parts, and an Australian dollar cost estimate range. The deterministic fallback runs a rule-based lookup first so diagnostics work even when the AI model is unreachable.</p>
        </details>
        <details>
          <summary>Do I need an OBD2 adapter to use AI Diagnostics?</summary>
          <p>No. You can describe symptoms in plain English without any hardware. Adding a $15–$40 ELM327 Bluetooth adapter lets AutoBrain read live OBD2 codes and sensor data directly, which improves accuracy and enables predictive maintenance alerts based on sensor trends.</p>
        </details>
        <details>
          <summary>What OBD2 codes does AutoBrain support?</summary>
          <p>AutoBrain covers all standard OBD2 generic codes (P0xxx, P2xxx, P3xxx, B0xxx, C0xxx, U0xxx) plus manufacturer-specific codes for major brands sold in Australia (Toyota, Ford, Holden, Mazda, Hyundai, Kia, Mitsubishi, Nissan, Subaru, Volkswagen, and more). The built-in code library includes plain-English explanations and Australian repair cost ranges for each code.</p>
        </details>
        <details>
          <summary>How accurate are the Australian repair cost estimates?</summary>
          <p>Cost estimates are based on Australian workshop labour rates ($120–$180/hr independent, $180–$250/hr dealer) and local parts pricing (OEM and aftermarket). They show a range (e.g. $400–$900 for alternator replacement) because actual cost depends on your specific vehicle, location, and workshop. Always get a written quote. AutoBrain tracks what you actually pay so future estimates are based on your history.</p>
        </details>
        <details>
          <summary>What does 'deterministic fallback' mean?</summary>
          <p>Every AI feature in AutoBrain has a rule-based path that runs first. For diagnostics, the fallback looks up the symptom or code in a curated knowledge base of Australian repair data and returns the same structured output (causes, severity, parts, cost range) without calling the AI model. If the AI is reachable, it enriches the answer with pattern recognition across your vehicle's history. If the AI is down, you still get a complete, accurate answer.</p>
        </details>
        <details>
          <summary>Can AutoBrain predict failures before a warning light appears?</summary>
          <p>Yes — that's predictive maintenance, which works alongside AI Diagnostics. With an OBD2 adapter connected, AutoBrain continuously monitors sensor trends (coolant temp creeping up, O2 voltage drifting, fuel trim leaning out, battery voltage declining) and alerts you when a component shows early warning signs. The Vehicle Health Score summarises this into a single 0–100 rating. See the Vehicle Health Score page for details.</p>
        </details>
        <details>
          <summary>Is my diagnostic data private?</summary>
          <p>Yes. The AI only sees the data needed for the specific diagnostic task you trigger. Its output is stored with your records. Your data is never used to train models or sold. Self-hosted instances can run entirely on the deterministic fallback with zero data leaving your server. See our AI & Your Data page for the full breakdown.</p>
        </details>
        <details>
          <summary>Which plans include AI Diagnostics?</summary>
          <p>The free hosted tier includes basic OBD2 code lookup and symptom matching from the rule-based knowledge base. Full AI enrichment (pattern recognition across your history, predictive insights, trend analysis) requires the Enthusiast plan ($5.90/month or $59/year) or Garage plan ($11.90/month or $119/year). Self-hosted instances get the full feature set free — wire your own AI router or run deterministic-only.</p>
        </details>
      </div>
    </div>
