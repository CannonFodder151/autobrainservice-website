      <h1 class="u-post-title">PHEV Tracking Australia — <span class="b">Dual-Source Fuel & Electric Dashboard</span></h1>
      <p class="meta">AutoBrain Team · 27 November 2026 · EV & Battery · 7 min read</p>
      <p class="lead">Most apps force a choice: track petrol <em>or</em> track electric. But a plug-in hybrid uses both. AutoBrain's PHEV support gives you one combined dashboard — petrol logs, charge sessions, real-world EV vs petrol split, and blended $/100km. Coming Q4 2026.</p>

      <h2>The PHEV problem</h2>
      <p>Australia has a growing plug-in hybrid fleet: Mitsubishi Outlander PHEV, MG HS+EV, BYD Seal U DM-i, Ford Escape PHEV, Volvo XC60/XC90 Recharge, BMW 330e/X5 xDrive45e, Mercedes GLC 300e, and more. But every tracking app makes you pick a lane:</p>
      <ul>
        <li><strong>Fuel apps</strong> (Fuelly, Drivvo, My Car) — track petrol, ignore electric</li>
        <li><strong>EV apps</strong> (Tesla, ChargePoint, PlugShare) — track charging, ignore petrol</li>
        <li><strong>Spreadsheets</strong> — manual, error-prone, no analytics</li>
      </ul>
      <p>Result: you have two incomplete pictures and no real answer to "what does this car actually cost me per kilometre?"</p>

      <h2>AutoBrain's solution: the powertrain enum</h2>
      <p>Every vehicle in AutoBrain now has a <strong>powertrain setting</strong> with four options:</p>
      <table>
        <thead><tr><th>Setting</th><th>Description</th><th>Logging enabled</th></tr></thead>
        <tbody>
          <tr><td><strong>ICE</strong></td><td>Petrol/diesel only</td><td>Fuel only</td></tr>
          <tr><td><strong>HEV</strong></td><td>Conventional hybrid (no plug)</td><td>Fuel only</td></tr>
          <tr><td><strong>PHEV</strong></td><td>Plug-in hybrid</td><td>Fuel <strong>+</strong> Charge</td></tr>
          <tr><td><strong>EV</strong></td><td>Battery-electric</td><td>Charge only</td></tr>
        </tbody>
      </table>
      <p>Set your vehicle to <strong>PHEV</strong> and both fuel logging <em>and</em> charge logging are enabled simultaneously. One vehicle, one dashboard, two energy sources tracked natively.</p>

      <h2>What the PHEV dashboard shows</h2>
      <p>Three views, one screen:</p>

      <h3>1. Petrol side (the familiar fuel log book)</h3>
      <ul>
        <li>Every fill-up: litres, cost, L/100km, $/km, station</li>
        <li>Rolling average L/100km and $/km</li>
        <li>Financial year exports for tax (ATO-compatible)</li>
        <li>Service predictions based on fuel-derived distance</li>
      </ul>

      <h3>2. Electric side (the new EV Log Book)</h3>
      <ul>
        <li>Every charge: kWh added, duration, cost, station, connector</li>
        <li>kWh/100km and $/100km efficiency — home vs public, AC vs DC</li>
        <li>Per-charge breakdown with time-of-use tariff awareness</li>
        <li>Battery health trend from capacity snapshots</li>
      </ul>

      <h3>3. Blended view (the magic)</h3>
      <ul>
        <li><strong>Combined $/100km</strong> — weighted by actual distance driven in each mode</li>
        <li><strong>EV% distance split</strong> — e.g. "68% electric, 32% petrol" (from OBD2 or manual entry)</li>
        <li><strong>Cost per km in EV mode vs petrol mode</strong> — see the real difference</li>
        <li><strong>Total energy cost per week/month/year</strong> — the number that matters</li>
      </ul>

      <h2>Real example: Sarah's MG HS+EV</h2>
      <p>Sarah drives a 2024 MG HS+EV PHEV in Brisbane. 40 km commute each way, charges at home overnight (off-peak 18¢/kWh), does weekend trips on petrol.</p>
      <table>
        <thead><tr><th>Metric</th><th>Value</th></tr></thead>
        <tbody>
          <tr><td>Weekly electric distance</td><td>280 km (70%)</td></tr>
          <tr><td>Weekly petrol distance</td><td>120 km (30%)</td></tr>
          <tr><td>Home charging cost</td><td>18¢/kWh off-peak = ~$3.60/100km</td></tr>
          <tr><td>Petrol cost</td><td>7.5 L/100km @ $1.95/L = ~$14.60/100km</td></tr>
          <tr><td><strong>Blended $/100km</strong></td><td><strong>$6.90</strong></td></tr>
        </tbody>
      </table>
      <p>Without the blended view, Sarah sees "$14.60/100km on petrol" and "$3.60/100km electric" as separate numbers. The blended $6.90/100km is what actually hits her wallet — and it's the number she uses to decide if the PHEV makes financial sense vs a pure EV or ICE.</p>

      <h2>OBD2 integration: automatic EV% split</h2>
      <p>With the recommended AutoBrain OBD2 adapter (or any ELM327 v1.4+), AutoBrain reads PHEV-specific PIDs where the vehicle supports them:</p>
      <ul>
        <li><strong>Battery state of charge (SoC)</strong> — live high-voltage pack percentage</li>
        <li><strong>EV mode distance</strong> — kilometres driven on electric only (from vehicle ECU)</li>
        <li><strong>Engine runtime vs motor runtime</strong> — how much the ICE actually ran</li>
        <li><strong>High-voltage battery temperature</strong> — thermal management insight</li>
        <li><strong>Charge/discharge power</strong> — real-time kW flow in/out of the pack</li>
      </ul>
      <p>These PIDs auto-populate the EV distance and engine distance fields, making the EV% split accurate without manual entry. Without an adapter, you can still log fill-ups and charges manually and enter the EV distance per trip.</p>

      <h2>Existing fuel data is preserved</h2>
      <p>Switching a vehicle's powertrain to PHEV is non-destructive:</p>
      <ul>
        <li>All historical fuel fill-ups remain unchanged and queryable</li>
        <li>Service records, receipts, parts, mods — all preserved</li>
        <li>Resale estimates, analytics, logbook exports — all continue working</li>
        <li>New electric fields simply appear alongside the existing petrol fields</li>
      </ul>
      <p>You don't migrate. You just start logging charges and the blended dashboard lights up.</p>

      <h2>ATO-compatible exports for PHEVs</h2>
      <p>Work-related car expenses in Australia can include both fuel and electricity. AutoBrain's export engine (the same one your fuel log book uses) produces a single CSV/JSON with:</p>
      <ul>
        <li>All petrol sessions: date, km, litres, cost, $/km, purpose</li>
        <li>All charge sessions: date, km, kWh, cost, $/100km, station, connector, purpose</li>
        <li>Blended summary: total km, EV%, petrol%, total cost, blended $/100km</li>
      </ul>
      <p>Your accountant gets one file. You claim both energy sources.</p>

      <h2>Frequently asked questions</h2>
      <div class="faq">
        <details>
          <summary>What is PHEV tracking in AutoBrain?</summary>
          <p>PHEV tracking gives plug-in hybrid owners a single combined dashboard that shows both petrol fill-ups and EV charge sessions side by side. You see your real-world electric-vs-petrol distance split, blended $/100km cost across both energy sources, and the same per-km cost tracking you already get for pure ICE vehicles — all on one screen.</p>
        </details>
        <details>
          <summary>How does the powertrain enum work?</summary>
          <p>Every vehicle in AutoBrain now has a powertrain setting: EV (battery-electric), HEV (conventional hybrid, no plug), PHEV (plug-in hybrid), or ICE (petrol/diesel only). This setting determines which logging fields appear, which efficiency metrics are calculated, and how the combined dashboard is rendered. PHEV owners get both fuel and charge logging enabled simultaneously.</p>
        </details>
        <details>
          <summary>Can I track electric and petrol costs separately and combined?</summary>
          <p>Yes. The PHEV dashboard shows three cost views: (1) Petrol only — L/100km and $/km from fuel fill-ups; (2) Electric only — kWh/100km and $/100km from charge sessions; (3) Blended — combined $/100km across both energy sources weighted by actual distance driven in each mode. You also see the EV% distance split (e.g. "68% electric, 32% petrol").</p>
        </details>
        <details>
          <summary>Does PHEV tracking work with OBD2?</summary>
          <p>Yes. AutoBrain reads PHEV-relevant OBD2 PIDs where available: battery state of charge, EV mode distance, engine runtime vs motor runtime, high-voltage battery temperature, and charge/discharge power. The recommended AutoBrain OBD2 adapter provides the most complete live data. Without an adapter, you can still log fill-ups and charges manually.</p>
        </details>
        <details>
          <summary>Are my existing fuel logs preserved when I switch a vehicle to PHEV?</summary>
          <p>Absolutely. The powertrain enum is a per-vehicle setting that only changes which input fields and metrics are shown going forward. Every existing fuel log stays exactly where it is. The new electric meters (charge sessions, kWh, EV distance) appear alongside your petrol history. ATO-compatible exports continue to include all the same fields they always have, plus the new electric fields.</p>
        </details>
        <details>
          <summary>Does the EV Log Book work for PHEVs?</summary>
          <p>Yes. The EV Log Book (kWh/100km, $/100km, per-charge cost) works for PHEV charge sessions exactly as it does for pure EVs. You log each charge — home wall box, public AC, public DC fast charger — and AutoBrain calculates the electric efficiency metrics. The petrol side continues to use the existing fuel log book (L/100km, $/km). Both feed into the blended dashboard.</p>
        </details>
        <details>
          <summary>When does PHEV support launch?</summary>
          <p>PHEV support is part of the EV feature rollout targeted for Q4 2026. The rollout order: Electric Spy (charging price watch) first, then EV Log Book (EV efficiency dashboard), then full PHEV dual-source support. Join the waitlist to be notified when PHEV tracking goes live.</p>
        </details>
        <details>
          <summary>Is PHEV tracking available on the free tier?</summary>
          <p>The free tier keeps basic PHEV vehicle creation and on-demand logging for both fuel and charge sessions. The full dual-source dashboard with blended metrics, EV% split, Electric Spy alerts, and the EV Log Book efficiency dashboard require the Enthusiast ($5.90/month or $59/year) or Garage ($11.90/month or $119/year) plans. Self-hosters get the full feature set free.</p>
        </details>
      </div>
