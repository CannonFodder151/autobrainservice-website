      <h1 class="u-post-title">Electric Spy — <span class="b">EV Charging Price Watch for Australia</span></h1>
      <p class="meta">AutoBrain Team · 27 November 2026 · EV & Battery · 7 min read</p>
      <p class="lead">Servo Spy watches petrol prices for you. Electric Spy does the same for EV charging stations. Star your chargers, set your threshold, get pinged when prices move. Live WA & QLD feeds, more states coming Q4 2026.</p>

      <h2>The problem: EV charging prices are all over the place</h2>
      <p>Public DC fast charging in Australia in 2026 ranges from <strong>45¢/kWh to 85¢/kWh</strong> — an 89% spread. On a 60 kWh charge for a typical EV, that's a <strong>$24 difference per session</strong> between the cheapest and most expensive network.</p>
      <p>Networks change prices weekly. Chargefox, Evie, Tesla, Jolt, NRMA, BP Pulse — they all adjust independently. Some offer off-peak discounts. Some surge at 5 PM. Unless you're checking every app before every charge, you're probably overpaying.</p>

      <h2>Enter Electric Spy</h2>
      <p>Electric Spy is the EV cousin of AutoBrain's Servo Spy (which has been watching WA and QLD petrol prices since 2024). Same idea, built for electrons:</p>
      <ol>
        <li><strong>Build your watchlist</strong> — browse the map, star the chargers you actually use. Filter by connector (CCS2, CHAdeMO, Type 2, Tesla), network, state.</li>
        <li><strong>Set your thresholds</strong> — "notify me if this charger drops more than 5¢/kWh" or "alert if price rises above 65¢/kWh". Different thresholds per charger, per connector.</li>
        <li><strong>Get alerted</strong> — Electric Spy polls live feeds on the same schedule as Servo Spy. The moment a watched station crosses your line, you get a push notification (and/or email, in-app).</li>
        <li><strong>Charge smarter</strong> — open the alert, see the new price, compare nearby starred chargers, pick the cheapest. Every session auto-logs to your EV Log Book with cost and kWh.</li>
      </ol>

      <h2>Live data: where we are, where we're going</h2>
      <p>Electric Spy uses the same state-by-state feed architecture as Servo Spy — official government feeds first, partner feeds where official doesn't exist:</p>
      <table>
        <thead><tr><th>State</th><th>Status</th><th>Source</th><th>Networks covered</th></tr></thead>
        <tbody>
          <tr><td><strong>WA</strong></td><td>🟢 Live</td><td>Official FuelWatch (extended to EV)</td><td>Chargefox, Evie, Tesla, Jolt, Synergy, Horizon, more</td></tr>
          <tr><td><strong>QLD</strong></td><td>🟢 Live</td><td>Fuel Prices QLD partner feed</td><td>Chargefox, Evie, Tesla, Jolt, NRMA, BP Pulse, more</td></tr>
          <tr><td><strong>NSW</strong></td><td>🟡 Pending</td><td>Partner feed API key awaited</td><td>Chargefox, Evie, Tesla, NRMA, Jolt, BP Pulse, Ampol</td></tr>
          <tr><td><strong>VIC</strong></td><td>🟡 Pending</td><td>Partner feed API key awaited</td><td>Chargefox, Evie, Tesla, Jolt, Ampol, BP Pulse, NRMA</td></tr>
          <tr><td><strong>ACT</strong></td><td>🟡 Pending</td><td>Partner feed API key awaited</td><td>Chargefox, Evie, Tesla, Jolt, NRMA</td></tr>
          <tr><td><strong>SA, NT, TAS</strong></td><td>⚪ Future</td><td>Under investigation</td><td>TBD</td></tr>
        </tbody>
      </table>
      <p>The architecture is state-agnostic. Each state lights up as its feed becomes available. Self-hosters can wire any feed with an API key immediately.</p>

      <h2>Real savings: the math</h2>
      <p>Let's say you drive a Tesla Model 3 RWD (60 kWh usable) 20,000 km/year in Sydney. You do 60% public charging (no home charger). That's ~12,000 km on public = ~2,400 kWh/year = ~40 charging sessions.</p>
      <ul>
        <li><strong>Without Electric Spy:</strong> You charge at whatever's convenient. Average 65¢/kWh. Annual cost: ~$1,560.</li>
        <li><strong>With Electric Spy:</strong> You catch 5¢/kWh drops on your starred chargers, avoid 75¢+ surges. Average 58¢/kWh. Annual cost: ~$1,392.</li>
        <li><strong>Savings:</strong> ~$168/year. For a driver doing 40,000 km with 80% public charging: ~$500–$600/year.</li>
      </ul>
      <p>For fleet or high-mileage drivers, the savings scale linearly. A rideshare driver doing 60,000 km/year on public charging could save $1,000+/year.</p>

      <h2>Integration with the EV Log Book</h2>
      <p>Electric Spy doesn't exist in isolation. Every charge at a watched station auto-logs to your EV Log Book:</p>
      <ul>
        <li><strong>kWh added, duration, cost, station, connector</strong> — all captured</li>
        <li><strong>$/100km and kWh/100km</strong> — real-world efficiency per charge and rolling average</li>
        <li><strong>Home vs public, AC vs DC</strong> — split your costs by charging type</li>
        <li><strong>Time-of-use aware</strong> — enter your home tariff, see home charging cost per session</li>
        <li><strong>ATO-compatible exports</strong> — work-related charging claims in the same CSV/JSON as fuel</li>
      </ul>
      <p>Route planning uses your vehicle's real consumption from the EV Log Book, not WLTP figures. Enter a destination, see stops optimised for lowest total cost, fastest time, or your preferred networks.</p>

      <h2>Self-hosters: bring your own feed</h2>
      <p>Self-hosted AutoBrain includes the full Electric Spy code path. You provide your own charging-feed API keys in the environment configuration:</p>
      <pre><code># Example environment variables for self-hosted Electric Spy
ELECTRIC_SPY_WA_FEED_URL=https://api.fuelwatch.wa.gov.au/ev
ELECTRIC_SPY_QLD_FEED_URL=https://api.fuelpricesqld.com.au/ev
ELECTRIC_SPY_POLL_INTERVAL_MINUTES=30
</code></pre>
      <p>The existing Celery beat schedule polls the feeds and triggers alerts on your infrastructure. No data leaves your server unless you configure it to.</p>

      <h2>Frequently asked questions</h2>
      <div class="faq">
        <details>
          <summary>What is Electric Spy?</summary>
          <p>Electric Spy is the EV cousin of AutoBrain's Servo Spy fuel price watch. You star your favourite charging stations, pick the connector types and networks you use, set a custom price-per-kWh move threshold, and Electric Spy notifies you the moment a station's price rises or drops past your line. Live pricing comes from the same state-by-state feed approach that powers Servo Spy — official government feeds plus partner feeds.</p>
        </details>
        <details>
          <summary>Which Australian states have live charging prices?</summary>
          <p>Western Australia via the official government FuelWatch feed (extended to EV chargers), and Queensland via the Fuel Prices QLD partner feed. New South Wales, ACT and Victoria are pending as partner-feed API keys are issued. The architecture is state-agnostic — each state lights up as its feed becomes available.</p>
        </details>
        <details>
          <summary>How much can Electric Spy save me?</summary>
          <p>Public DC fast charging in Australia ranges from 45¢/kWh to 85¢/kWh depending on network and location. On a 60 kWh charge, that's a $24 difference per session. For a driver doing 20,000 km/year with 60% public charging, Electric Spy alerts could save $500–$1,500/year by catching price drops and avoiding expensive stations.</p>
        </details>
        <details>
          <summary>Does Electric Spy work with home charging?</summary>
          <p>Electric Spy tracks public charging stations from live feeds. Home charging costs are tracked separately in the EV Log Book — you enter your home electricity rate (or time-of-use tariff) and AutoBrain calculates $/100 km for home charges alongside public sessions.</p>
        </details>
        <details>
          <summary>Can self-hosters use Electric Spy?</summary>
          <p>Yes. Self-hosted AutoBrain includes the same Electric Spy code path. You provide your own charging-feed API keys (WA government, Fuel Prices QLD, or other sources) in the environment configuration, and the existing Celery beat schedule polls the feeds and triggers alerts on your infrastructure.</p>
        </details>
        <details>
          <summary>When does Electric Spy launch?</summary>
          <p>Electric Spy is targeted for Q4 2026 as part of the EV feature rollout. It will ship in waves: Electric Spy first, then the EV Log Book efficiency dashboard, then full PHEV dual-source support. Join the waitlist to be notified the day it lands.</p>
        </details>
        <details>
          <summary>Is Electric Spy free?</summary>
          <p>The free tier keeps basic EV vehicle creation and on-demand charge logging. Live Electric Spy price alerts, the full EV Log Book efficiency dashboard, and PHEV dual-source tracking are available on the Enthusiast ($5.90/month or $59/year) and Garage ($11.90/month or $119/year) hosted plans. Self-hosters get the full feature set free with their own feed API keys.</p>
        </details>
      </div>
