      <h1 class="u-post-title">AI Car Diagnostics — <span class="b">How AutoBrain Turns Symptoms & Codes into Answers</span></h1>
      <p class="meta">AutoBrain Team · 27 November 2026 · AI & Technology · 8 min read</p>
      <p class="lead">Check engine light on? Weird noise? Burning smell? Describe it in plain English or paste the OBD2 code. AutoBrain returns likely causes, severity, affected parts, and Australian repair cost estimates — and it works even when the AI is down.</p>

      <h2>Two ways in, one structured answer out</h2>
      <p>AutoBrain AI Diagnostics accepts two input types:</p>
      <div class="grid">
        <div class="card">
          <span class="icon">🗣️</span>
          <h3>Describe the symptom</h3>
          <p>Type what you experience: "car shakes at 60km/h", "rough idle when cold", "burning smell from engine bay", "brake pedal feels spongy", "whining noise when turning". No technical knowledge needed.</p>
        </div>
        <div class="card">
          <span class="icon">📟</span>
          <h3>Paste the OBD2 code</h3>
          <p>Scan with any ELM327 adapter or enter manually: P0300, P0420, P0171, B1001, C1234. Get plain-English meaning, severity, affected parts, and Australian cost range.</p>
        </div>
      </div>
      <p>Either way, you get the same structured output:</p>
      <ol>
        <li><strong>Likely causes (ranked)</strong> — top 3–5 causes by probability for your make/model/year</li>
        <li><strong>Severity rating</strong> — Low / Medium / High / Critical with clear action guidance</li>
        <li><strong>Affected parts</strong> — specific components: "ignition coil #3", "front left brake rotor", "thermostat housing"</li>
        <li><strong>Australian cost estimate</strong> — parts + labour range for independent vs dealer workshops</li>
      </ol>

      <h2>The deterministic-first difference</h2>
      <p>This is where AutoBrain differs from every other "AI car app" on the market.</p>
      <p><strong>Most AI apps:</strong> Send your input to an LLM. If the model is down, rate-limited, or hallucinating, you get nothing — or worse, confident nonsense.</p>
      <p><strong>AutoBrain:</strong> Runs a rule-based lookup <em>first</em>. Our curated Australian repair knowledge base matches your symptom/code to causes, severity, parts, and cost ranges — no AI call needed. The AI model only <em>enriches</em> the answer when reachable: pattern recognition across your vehicle's history, cross-referencing sensor trends, predicting "this P0300 was coil #2 last time."</p>
      <p>If the AI is unreachable, you still get a complete, accurate, actionable answer from the rule engine. No blank screens. No "try again later." No feature that becomes a gamble.</p>
      <p class="u-mt-14"><a href="ai-that-works-even-when-the-ai-is-down.html">Read the architecture deep-dive: AI That Works Even When the AI Is Down →</a></p>

      <h2>Real example: P0420 on a 2017 Subaru Forester</h2>
      <p>Input: <code>P0420</code> (Catalyst System Efficiency Below Threshold — Bank 1)</p>
      <p><strong>Rule-based output (instant, always works):</strong></p>
      <ul>
        <li><strong>Cause 1 (65%):</strong> Catalytic converter degraded — typical at 120,000+ km</li>
        <li><strong>Cause 2 (25%):</strong> Downstream O2 sensor failing — cheaper fix, test first</li>
        <li><strong>Cause 3 (10%):</strong> Exhaust leak before cat — check gaskets, flex pipe</li>
        <li><strong>Severity:</strong> Medium — schedule within 2 weeks, not an immediate safety risk</li>
        <li><strong>Parts:</strong> Catalytic converter (direct-fit $400–$800), O2 sensor ($80–$150), exhaust gaskets ($20–$50)</li>
        <li><strong>Australian cost range:</strong> Independent $500–$1,200 | Dealer $1,000–$2,000</li>
      </ul>
      <p><strong>AI enrichment (when reachable):</strong> "Your Forester showed P0420 at 118,000km. Downstream O2 voltage has been drifting lazy for 3 months. Pattern matches 87% converter failure in this model/year. Recommend O2 sensor test first — if voltage switches normally under load, it's the cat."</p>
      <p>The rule-based answer gets you to the mechanic with the right parts priced. The AI enrichment helps you and the mechanic test the right thing first.</p>

      <h2>Built-in OBD2 code library</h2>
      <p>AutoBrain includes a searchable library covering every standard code plus manufacturer-specific codes for Australian-market vehicles:</p>
      <ul>
        <li><strong>Generic powertrain (P0xxx, P2xxx, P3xxx)</strong> — all standard emission codes</li>
        <li><strong>Body (B0xxx)</strong> — airbags, climate, lighting, doors, seats</li>
        <li><strong>Chassis (C0xxx)</strong> — ABS, ESC, suspension, steering, TPMS</li>
        <li><strong>Network (U0xxx)</strong> — CAN bus, module communication, gateway</li>
        <li><strong>Manufacturer-specific</strong> — Toyota, Ford, Holden, Mazda, Hyundai, Kia, Mitsubishi, Nissan, Subaru, VW, and more</li>
      </ul>
      <p>Each entry includes: plain-English description, common causes for Australian conditions (heat, dust, fuel quality), typical repair cost range, and related codes.</p>

      <h2>Diagnostic history builds a fingerprint</h2>
      <p>Every diagnostic session saves to your vehicle's timeline:</p>
      <ul>
        <li>Symptom or code entered</li>
        <li>Causes returned (ranked)</li>
        <li>Severity at time of diagnosis</li>
        <li>What you actually did (replaced part, cleared code, monitored)</li>
        <li>Actual cost vs estimate</li>
      </ul>
      <p>Over time this builds a diagnostic fingerprint for your car. Recurring codes, intermittent faults, and "fixed but came back" patterns become visible — helping you and your mechanic catch root causes, not just symptoms.</p>

      <h2>Integration with predictive maintenance</h2>
      <p>AI Diagnostics doesn't exist in isolation. With an OBD2 adapter connected:</p>
      <ul>
        <li><strong>Vehicle Health Score</strong> incorporates diagnostic history into the 0–100 rating (<a href="../vehicle-health-score.html">see feature page</a>)</li>
        <li><strong>Trend alerts</strong> fire when sensor data suggests a component is degrading <em>before</em> a code sets</li>
        <li><strong>Service predictions</strong> use fault code history + sensor trends + service intervals</li>
        <li><strong>Resale estimates</strong> factor in documented diagnostic history</li>
      </ul>
      <p class="u-mt-14"><a href="predictive-maintenance-car-ai-diagnostics.html">Read the predictive maintenance guide →</a></p>

      <h2>Privacy: your data, your diagnostic</h2>
      <p>The AI only sees the data needed for the specific diagnostic task you trigger. Its output is stored with your records. Your data is never used to train models or sold. Self-hosted instances can run entirely on the deterministic fallback with zero data leaving your server.</p>
      <p class="u-mt-14"><a href="../ai-data.html">Read the full AI & Your Data breakdown →</a></p>

      <h2>Frequently asked questions</h2>
      <div class="faq">
        <details>
          <summary>How does AutoBrain AI Diagnostics work?</summary>
          <p>You describe a symptom in plain English (e.g. "car shakes at 60km/h", "burning smell from engine bay") or paste an OBD2 fault code (e.g. P0300, P0420). AutoBrain's AI analyses your input against its training on Australian repair data and returns: likely causes ranked by probability, severity rating, affected parts, and an Australian dollar cost estimate range. The deterministic fallback runs a rule-based lookup first so diagnostics work even when the AI model is unreachable.</p>
        </details>
        <details>
          <summary>Do I need an OBD2 adapter for AI Diagnostics?</summary>
          <p>No. You can describe symptoms in plain English without any hardware. Adding a $15–$40 ELM327 Bluetooth adapter lets AutoBrain read live OBD2 codes and sensor data directly, which improves accuracy and enables predictive maintenance alerts based on sensor trends.</p>
        </details>
        <details>
          <summary>What OBD2 codes does AutoBrain support?</summary>
          <p>AutoBrain covers all standard OBD2 generic codes (P0xxx, P2xxx, P3xxx, B0xxx, C0xxx, U0xxx) plus manufacturer-specific codes for major brands sold in Australia (Toyota, Ford, Holden, Mazda, Hyundai, Kia, Mitsubishi, Nissan, Subaru, Volkswagen, and more). The built-in code library includes plain-English explanations and Australian repair cost ranges for each code.</p>
        </details>
        <details>
          <summary>How accurate are the Australian repair cost estimates?</summary>
          <p>Cost estimates are based on Australian workshop labour rates ($120–$180/hr independent, $180–$250/hr dealer) and local parts pricing (OEM and aftermarket). They show a range (e.g. $400–$900 for alternator replacement) because actual cost depends on your specific vehicle, location, and workshop. Always get a written quote. AutoBrain tracks what you actually pay so future estimates are based on your history.</p>
        </details>
        <details>
          <summary>What does deterministic fallback mean?</summary>
          <p>Every AI feature in AutoBrain has a rule-based path that runs first. For diagnostics, the fallback looks up the symptom or code in a curated knowledge base of Australian repair data and returns the same structured output (causes, severity, parts, cost range) without calling the AI model. If the AI is reachable, it enriches the answer with pattern recognition across your vehicle's history. If the AI is down, you still get a complete, accurate answer.</p>
        </details>
        <details>
          <summary>Can AutoBrain predict failures before a warning light appears?</summary>
          <p>Yes — that's predictive maintenance, which works alongside AI Diagnostics. With an OBD2 adapter connected, AutoBrain continuously monitors sensor trends (coolant temp creeping up, O2 voltage drifting, fuel trim leaning out, battery voltage declining) and alerts you when a component shows early warning signs. The Vehicle Health Score summarises this into a single 0–100 rating. See the Vehicle Health Score page for details.</p>
        </details>
        <details>
          <summary>Is my diagnostic data private?</summary>
          <p>Yes. The AI only sees the data needed for the specific diagnostic task you trigger. Its output is stored with your records. Your data is never used to train models or sold. Self-hosted instances can run entirely on the deterministic fallback with zero data leaving your server. See our AI & Your Data page for the full breakdown.</p>
        </details>
        <details>
          <summary>Which plans include AI Diagnostics?</summary>
          <p>The free hosted tier includes basic OBD2 code lookup and symptom matching from the rule-based knowledge base. Full AI enrichment (pattern recognition across your history, predictive insights, trend analysis) requires the Enthusiast plan ($5.90/month or $59/year) or Garage plan ($11.90/month or $119/year). Self-hosted instances get the full feature set free — wire your own AI router or run deterministic-only.</p>
        </details>
      </div>
