      <h1 class="u-post-title">Vehicle Health Score Explained — <span class="b">Your Car's 0–100 Health Rating</span></h1>
      <p class="meta">AutoBrain Team · 27 November 2026 · Features · 8 min read</p>
      <p class="lead">One number that tells you how healthy your car really is. AutoBrain analyses OBD2 live data, service records and driving patterns to generate a real-time Vehicle Health Score with trend tracking — and it works even when the AI is down.</p>

      <h2>Why a single score matters</h2>
      <p>Your car generates thousands of data points every drive: coolant temperature, O2 sensor voltage, fuel trims, battery voltage, RPM stability, intake air temperature. Add your service history (when you last changed oil, brakes, coolant, filters) and your driving patterns (short trips vs highway, cold starts, load, idle time). That's a lot to keep in your head.</p>
      <p>The Vehicle Health Score distills all of it into one 0–100 number you can glance at and understand instantly. Track it week to week. Get alerted when it drops. Know exactly which system is dragging it down.</p>

      <h2>The four pillars</h2>
      <p>AutoBrain doesn't guess. The score is computed from four measurable pillars, each weighted by its impact on real-world reliability:</p>

      <h3>1. OBD2 live sensor trends (35% weight)</h3>
      <p>With an ELM327 adapter connected, AutoBrain reads your car's live data every drive and tracks trends, not just snapshots:</p>
      <ul>
        <li><strong>Coolant temperature</strong> — creeping up 2°C/month? Thermostat or water pump wearing out.</li>
        <li><strong>O2 sensor voltage</strong> — slow decline? Sensor aging, will trigger P013x/P015x codes soon.</li>
        <li><strong>Short/long-term fuel trims</strong> — drifting lean or rich? Vacuum leak, injector, or MAF issue developing.</li>
        <li><strong>Battery resting voltage</strong> — below 12.4V consistently? Battery sulphating, 4+ years old.</li>
        <li><strong>RPM stability at idle</strong> — increasing variance? Idle air control, vacuum leak, or misfire brewing.</li>
        <li><strong>Intake air temperature</strong> — running hot? Intercooler efficiency, intake tract issue.</li>
      </ul>
      <p>Each sensor gets a sub-score. The trend (improving/stable/declining) matters more than the absolute value.</p>

      <h3>2. Service history completeness (25% weight)</h3>
      <p>AutoBrain knows the manufacturer schedule for your specific make/model/year. It checks:</p>
      <ul>
        <li>Engine oil & filter — interval and oil grade compliance</li>
        <li>Brake fluid — 2-year hygroscopic replacement cycle</li>
        <li>Coolant — 5-year/100,000km or 10-year/200,000km per spec</li>
        <li>Transmission fluid — often overlooked, critical for longevity</li>
        <li>Spark plugs — 60,000–120,000km depending on type</li>
        <li>Timing belt/chain — the catastrophic failure item</li>
        <li>Tyre rotations — even wear extends life 20–30%</li>
        <li>Cabin & engine air filters — airflow = efficiency</li>
      </ul>
      <p>A complete, on-time service history adds points. Overdue items subtract proportionally to their risk.</p>

      <h3>3. Driving pattern analysis (20% weight)</h3>
      <p>How you drive changes how fast components wear. AutoBrain analyses:</p>
      <ul>
        <li><strong>Trip length distribution</strong> — lots of sub-5km trips? Battery never fully recharges, oil dilution, exhaust condensation.</li>
        <li><strong>Cold start frequency</strong> — each cold start = 80% of engine wear. High frequency accelerates everything.</li>
        <li><strong>Engine load factor</strong> — towing, heavy acceleration, hill climbing = higher cylinder pressure = faster wear.</li>
        <li><strong>Idle time</strong> — excessive idling wastes fuel, cooks oil, builds carbon.</li>
        <li><strong>Highway vs city ratio</strong> — highway is gentler on brakes, transmission, engine (steady load).</li>
      </ul>
      <p>Your driving pattern adjusts the service intervals dynamically. A city driver doing short trips needs oil changes more often than a highway cruiser.</p>

      <h3>4. AI anomaly detection (20% weight)</h3>
      <p>This is where the AI model adds value when reachable. It looks for patterns humans miss:</p>
      <ul>
        <li>Intermittent fault codes that come and go (early warning of connector, sensor, or harness issues)</li>
        <li>Cross-system correlations (coolant temp rising + fuel trim leaning = head gasket starting to weep)</li>
        <li>Seasonal drift patterns (battery voltage drops every winter, but this year it's lower)</li>
        <li>Post-service anomalies (code appears right after a service — maybe a connector wasn't seated)</li>
      </ul>
      <p><strong>Critical:</strong> The deterministic fallback computes a complete rule-based score using pillars 1–3 plus rule-based anomaly detection (threshold crossings, interval overruns, pattern heuristics). The AI only enriches the score. If the AI is down, your score keeps updating with full utility.</p>

      <h2>Component-level breakdown</h2>
      <p>The overall score expands into seven sub-scores so you're never guessing:</p>
      <table>
        <thead><tr><th>Sub-score</th><th>What it tracks</th></tr></thead>
        <tbody>
          <tr><td><strong>Engine</strong></td><td>Compression trends, misfire history, oil condition, timing</td></tr>
          <tr><td><strong>Transmission</strong></td><td>Fluid health, shift quality indicators, torque converter</td></tr>
          <tr><td><strong>Brakes</strong></td><td>Pad wear estimate from stop patterns, fluid age, rotor condition</td></tr>
          <tr><td><strong>Battery</strong></td><td>Resting voltage, cranking voltage, charge acceptance, age</td></tr>
          <tr><td><strong>Cooling</strong></td><td>Thermostat behaviour, fan operation, coolant concentration</td></tr>
          <tr><td><strong>Fuel System</strong></td><td>Injector health, pump pressure trends, filter status</td></tr>
          <tr><td><strong>Tyres</strong></td><td>Rotation schedule, pressure trends, alignment indicators</td></tr>
        </tbody>
      </table>
      <p>Tap any sub-score to see the specific sensor trends, overdue services, or driving factors behind the rating.</p>

      <h2>Real example: Melissa's 2018 Mazda CX-5</h2>
      <p>Melissa drives a 2018 Mazda CX-5 diesel in Melbourne. She connected a $25 ELM327 adapter three months ago. Her Vehicle Health Score started at 87.</p>
      <ul>
        <li><strong>Week 2:</strong> Score dipped to 82. Coolant temp trend showed +1.5°C/month. Sub-score: Cooling 65.</li>
        <li><strong>Week 4:</strong> Score 78. Cooling sub-score 58. AI flagged "thermostat stuck open pattern — coolant reaches operating temp 15% slower than baseline."</li>
        <li><strong>Week 6:</strong> Melissa booked a service. Mechanic confirmed stuck-open thermostat. $280 repair.</li>
        <li><strong>Week 7:</strong> Post-repair score 92. Cooling sub-score 95. Trend reversed.</li>
      </ul>
      <p>Without the score, she'd have waited for the temperature gauge to climb — risking overheating and a head gasket. The early catch saved ~$2,500.</p>

      <h2>Deterministic-first: works when AI is down</h2>
      <p>This is the AutoBrain difference. Every feature runs on a rule-based path first. The Vehicle Health Score's deterministic engine:</p>
      <ul>
        <li>Applies manufacturer service intervals to your logged history</li>
        <li>Checks OBD2 sensors against engineering thresholds (not ML predictions)</li>
        <li>Evaluates driving patterns against heuristics (short trips = battery stress, etc.)</li>
        <li>Flags rule-based anomalies (code recurrence, interval overruns, threshold crossings)</li>
      </ul>
      <p>The AI model only adds: "this pattern looks like the 500 similar cases where a thermostat failed within 2,000km." If the model is unreachable, you still get the rule-based score with trend direction and component breakdown. No blank screens. No "try again later."</p>

      <h2>Frequently asked questions</h2>
      <div class="faq">
        <details>
          <summary>What is the Vehicle Health Score?</summary>
          <p>The Vehicle Health Score is a single 0–100 rating that summarises your car's overall condition. It combines OBD2 live sensor data, service history completeness, driving pattern analysis, and AI trend detection into one number you can track over time. A score of 90+ means excellent health; below 60 suggests attention needed.</p>
        </details>
        <details>
          <summary>How is the Vehicle Health Score calculated?</summary>
          <p>AutoBrain weights four pillars: (1) OBD2 sensor trends — coolant temp, O2 voltage, fuel trims, battery voltage; (2) Service history — recency and completeness of oil, filters, brakes, fluids; (3) Driving patterns — trip length, cold starts, load factor, idle time; (4) AI anomaly detection — early warning signs from fault code history and sensor drift. The deterministic fallback computes a rule-based score when the AI model is unreachable.</p>
        </details>
        <details>
          <summary>Do I need an OBD2 adapter for the Vehicle Health Score?</summary>
          <p>You get a baseline score from service history and driving patterns alone. Adding a $15–$40 ELM327 Bluetooth adapter unlocks live OBD2 data for a much more accurate, real-time score with component-level breakdowns and trend alerts.</p>
        </details>
        <details>
          <summary>Is the Vehicle Health Score free?</summary>
          <p>The free hosted tier includes a basic health score using service history and driving patterns. Full OBD2 live analysis, AI trend detection, component breakdowns, and trend alerts require the Enthusiast plan ($5.90/month or $59/year) or Garage plan ($11.90/month or $119/year). Self-hosted instances get the full feature set free.</p>
        </details>
        <details>
          <summary>Does it work on older cars?</summary>
          <p>Yes. Any Australian OBD2-compliant vehicle (built after 2006) works. Older cars with fewer sensors still get a meaningful score from service history, driving patterns, and the sensors that are available (coolant temp, RPM, battery voltage, fuel trims).</p>
        </details>
        <details>
          <summary>How often does the score update?</summary>
          <p>With an OBD2 adapter connected, the score recalculates after every drive. Without hardware, it updates when you log a service, fuel fill-up, or trip. You also get a weekly summary notification with the trend direction.</p>
        </details>
      </div>
