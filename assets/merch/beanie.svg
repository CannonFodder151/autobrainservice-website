<svg xmlns="http://www.w3.org/2000/svg" width="800" height="800" viewBox="0 0 800 800" role="img" aria-label="AutoBrain Beanie product photo — charcoal grey beanie with electric blue embroidered logo">
  <defs>
    <linearGradient id="beanieBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2937"/>
      <stop offset="0.3" stop-color="#181f2a"/>
      <stop offset="0.6" stop-color="#111827"/>
      <stop offset="1" stop-color="#0a0f1a"/>
    </linearGradient>
    <linearGradient id="beanieHighlight" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#374151" stop-opacity="0.3"/>
      <stop offset="0.5" stop-color="#4b5563" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#1f2937" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="embroideryThread" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="0.5" stop-color="#00b7ff"/>
      <stop offset="1" stop-color="#007bff"/>
    </linearGradient>
    <linearGradient id="embroideryHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#00b7ff"/>
    </linearGradient>
    <filter id="embroideryTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.08" numOctaves="3" stitchTiles="stitch" result="noise"/>
      <feDiffuseLighting in="noise" lighting-color="#00b7ff" surfaceScale="3">
        <feDistantLight azimuth="45" elevation="60"/>
      </feDiffuseLighting>
      <feComposite in="SourceGraphic" operator="arithmetic" k1="0" k2="1" k3="0.3" k4="0"/>
    </filter>
    <filter id="fabricTexture" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="4" stitchTiles="stitch" result="fabricNoise"/>
      <feColorMatrix in="fabricNoise" type="saturate" values="0"/>
      <feBlend in="SourceGraphic" in2="fabricNoise" mode="multiply"/>
    </filter>
    <filter id="dropShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="12"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <pattern id="knitPattern" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse">
      <ellipse cx="4" cy="4" rx="2.5" ry="1.5" fill="#2d3748" fill-opacity="0.15"/>
      <ellipse cx="4" cy="4" rx="1.5" ry="2.5" fill="#2d3748" fill-opacity="0.1"/>
    </pattern>
  </defs>

  <!-- Drop shadow for entire beanie -->
  <g filter="url(#dropShadow)">
    <!-- Main beanie body (cuff folded up) -->
    <!-- Lower cuff section -->
    <path d="M180 520 Q180 470 230 450 Q320 430 400 430 Q480 430 570 450 Q620 470 620 520 Q620 580 570 610 Q480 635 400 635 Q320 635 230 610 Q180 580 180 520 Z" fill="url(#beanieBody)" filter="url(#fabricTexture)"/>
    <path d="M180 520 Q180 470 230 450 Q320 430 400 430 Q480 430 570 450 Q620 470 620 520" fill="none" stroke="url(#beanieHighlight)" stroke-width="2"/>

    <!-- Upper crown section -->
    <path d="M200 450 Q200 320 280 250 Q350 200 400 200 Q450 200 520 250 Q600 320 600 450 Q600 500 520 530 Q400 550 280 530 Q200 500 200 450 Z" fill="url(#beanieBody)" filter="url(#fabricTexture)"/>
    <path d="M200 450 Q200 320 280 250 Q350 200 400 200 Q450 200 520 250 Q600 320 600 450" fill="none" stroke="url(#beanieHighlight)" stroke-width="1.5"/>

    <!-- Top crown highlight -->
    <ellipse cx="400" cy="240" rx="120" ry="40" fill="url(#beanieHighlight)" opacity="0.4"/>

    <!-- Subtle knit texture overlay on crown -->
    <path d="M200 450 Q200 320 280 250 Q350 200 400 200 Q450 200 520 250 Q600 320 600 450" fill="url(#knitPattern)" opacity="0.3"/>

    <!-- Embroidered AutoBrain logo on cuff -->
    <g transform="translate(400, 525)" filter="url(#embroideryTexture)">
      <!-- "AB" monogram -->
      <text x="0" y="10" font-family="Orbitron, sans-serif" font-size="56" font-weight="900" fill="url(#embroideryThread)" text-anchor="middle" letter-spacing="2" paint-order="stroke fill" stroke="url(#embroideryHighlight)" stroke-width="1.5">AB</text>
      <!-- Accent dots -->
      <circle cx="-65" cy="-15" r="4" fill="url(#embroideryThread)"/>
      <circle cx="65" cy="-15" r="4" fill="url(#embroideryThread)"/>
      <!-- Small line under -->
      <path d="M-80 25 Q0 15 80 25" fill="none" stroke="url(#embroideryThread)" stroke-width="3" stroke-linecap="round"/>
    </g>

    <!-- Stitching detail on cuff edge -->
    <g fill="none" stroke="#111827" stroke-width="1.5" stroke-opacity="0.6">
      <path d="M200 520 Q200 470 250 450 Q320 430 400 430 Q480 430 550 450 Q600 470 600 520"/>
      <g transform="translate(400, 430)">
        <!-- Decorative stitch marks along top of cuff -->
        <line x1="-180" y1="0" x2="-180" y2="8" stroke="#374151" stroke-width="1" opacity="0.4"/>
        <line x1="-120" y1="0" x2="-120" y2="8" stroke="#374151" stroke-width="1" opacity="0.4"/>
        <line x1="-60" y1="0" x2="-60" y2="8" stroke="#374151" stroke-width="1" opacity="0.4"/>
        <line x1="0" y1="0" x2="0" y2="8" stroke="#374151" stroke-width="1" opacity="0.4"/>
        <line x1="60" y1="0" x2="60" y2="8" stroke="#374151" stroke-width="1" opacity="0.4"/>
        <line x1="120" y1="0" x2="120" y2="8" stroke="#374151" stroke-width="1" opacity="0.4"/>
        <line x1="180" y1="0" x2="180" y2="8" stroke="#374151" stroke-width="1" opacity="0.4"/>
      </g>
    </g>

    <!-- Inner cuff seam line -->
    <path d="M220 520 Q220 485 270 470 Q350 455 400 455 Q450 455 530 470 Q580 485 580 520" fill="none" stroke="#0a0f1a" stroke-width="1.5" stroke-opacity="0.5"/>

  </g>

  <!-- Product label / tag hanging -->
  <g transform="translate(620, 380)">
    <path d="M0 0 L15 -10 L45 -10 L60 0 L45 10 L15 10 Z" fill="#fbbf24" stroke="#d97706" stroke-width="1.5"/>
    <circle cx="30" cy="0" r="4" fill="#d97706"/>
    <text x="30" y="4" font-family="Exo 2, sans-serif" font-size="10" font-weight="700" fill="#1f2937" text-anchor="middle">A$25</text>
    <!-- String -->
    <path d="M30 -10 Q30 -30 400 -30" fill="none" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="4,3" opacity="0.6"/>
  </g>
</svg>